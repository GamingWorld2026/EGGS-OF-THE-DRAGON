<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eggs of the Dragon - Epic Collection</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            background-color: #1a1a2e;
            color: #ecf0f1;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #main-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #1a1a2e;
            border: 8px solid #2d3748;
            box-shadow: 0 0 50px rgba(0, 0, 0, 1), 0 0 15px rgba(142, 68, 173, 0.5);
            border-radius: 12px;
            padding: 40px;
            z-index: 20;
            position: absolute;
        }

        .menu-title {
            font-size: 48px;
            color: #f1c40f;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 2px 2px 5px #000;
        }

        .menu-subtitle {
            font-size: 18px;
            color: #bdc3c7;
            margin-bottom: 30px;
            text-align: center;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        button.level-btn {
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(180deg, #34495e, #2c3e50);
            color: #f1c40f;
            border: 2px solid #7f8c8d;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            transition: 0.2s;
        }

        button.level-btn:hover {
            background: linear-gradient(180deg, #415b76, #34495e);
            transform: scale(1.05);
            border-color: #f1c40f;
            color: #fff;
        }

        /* Kilitli Level Butonu Stilleri */
        button.level-btn.locked {
            background: linear-gradient(180deg, #2c3e50, #1a252f);
            color: #7f8c8d;
            border-color: #34495e;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.7;
        }

        button.level-btn.locked:hover {
            transform: none;
            border-color: #34495e;
            color: #7f8c8d;
        }

        #game-frame-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .back-bar {
            width: 100%;
            padding: 10px 20px;
            background-color: #0b0c10;
            display: flex;
            justify-content: flex-start;
            box-sizing: border-box;
            border-bottom: 2px solid #2d3748;
        }

        button.back-btn {
            padding: 8px 15px;
            font-size: 16px;
            font-weight: bold;
            background-color: #e74c3c;
            color: white;
            border: 2px solid #c0392b;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
        }

        button.back-btn:hover {
            background-color: #c0392b;
            transform: scale(1.05);
        }

        iframe {
            width: 100%;
            height: calc(100vh - 50px);
            border: none;
            background-color: #0b0c10;
        }
        
        #reset-btn {
            margin-top: 20px;
            padding: 8px 15px;
            font-size: 14px;
            background-color: #2c3e50;
            color: #bdc3c7;
            border: 1px solid #7f8c8d;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        #reset-btn:hover {
            color: #e74c3c;
            border-color: #e74c3c;
        }
    </style>
</head>
<body>

    <!-- ANA MENÜ -->
    <div id="main-menu">
        <div class="menu-title">Eggs of the Dragon</div>
        <div class="menu-subtitle">Select your level to begin the adventure</div>
        
        <div class="level-grid" id="level-grid">
            <!-- Butonlar JavaScript ile yüklenecek -->
        </div>
        
        <button id="reset-btn" onclick="resetProgress()">Restart Progress</button>
    </div>

    <!-- OYUN ÇERÇEVESİ (IFRAME) -->
    <div id="game-frame-container">
        <div class="back-bar">
            <button class="back-btn" onclick="backToMenu()">🔙 Back to Menu</button>
        </div>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        const levels = [
            "LEVEL1.html",
            "LEVEL2.html",
            "LEVEL3.html",
            "LEVEL4.html",
            "LEVEL5.html",
            "LEVEL6.html",
            "LEVEL7.html",
            "LEVEL8.html",
            "LEVEL9.html",
            "LEVEL10.html"
        ];

        const grid = document.getElementById('level-grid');
        const mainMenu = document.getElementById('main-menu');
        const frameContainer = document.getElementById('game-frame-container');
        const gameFrame = document.getElementById('game-frame');

        // Kullanıcının ulaştığı en yüksek leveli al. (Yoksa 1. level açıktır)
        let unlockedLevel = parseInt(localStorage.getItem('dragonEggsUnlockedLevel')) || 1;

        // Level butonlarını dinamik oluştur
        function renderLevels() {
            grid.innerHTML = ''; // Önceki butonları temizle
            
            levels.forEach((file, index) => {
                const levelNum = index + 1;
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                
                if (levelNum <= unlockedLevel) {
                    // Kilit AÇIK
                    btn.innerText = `Level ${levelNum}`;
                    btn.onclick = () => loadLevel(file, levelNum);
                } else {
                    // Kilit KAPALI
                    btn.classList.add('locked');
                    btn.innerText = `Level ${levelNum} 🔒`;
                    // Tıklanamasın
                }
                
                grid.appendChild(btn);
            });
        }

        function loadLevel(fileName, levelNum) {
            gameFrame.src = fileName;
            mainMenu.style.display = 'none';
            frameContainer.style.display = 'flex';
            
            setTimeout(() => {
                gameFrame.focus();
            }, 100);
        }

        function backToMenu() {
            gameFrame.src = "";
            frameContainer.style.display = 'none';
            mainMenu.style.display = 'flex';
            renderLevels(); // Menüye dönünce butonları güncelle (yeni açılan varsa yansısın)
        }

        // İlerlemeyi sıfırlamak için küçük bir fonksiyon (Test için çok işine yarar)
        function resetProgress() {
            if(confirm("Are you sure you want to reset all your progress?")) {
                localStorage.setItem('dragonEggsUnlockedLevel', 1);
                unlockedLevel = 1;
                renderLevels();
            }
        }

        // İLK YÜKLEME
        renderLevels();

        // ------ ÇOK ÖNEMLİ BÖLÜM: OYUNDAN (IFRAME) GELEN MESAJI DİNLE ------
        window.addEventListener('message', (event) => {
            // Eğer iframe içindeki oyun "level_completed" mesajı gönderirse:
            if (event.data && event.data.type === 'level_completed') {
                const completedLevelNum = event.data.levelNumber; // Kazandığı level
                const nextLevelNum = completedLevelNum + 1;

                // Eğer bir sonraki level şu anki kilidi açık levellerden büyükse (yeni level açılıyorsa)
                if (nextLevelNum > unlockedLevel && nextLevelNum <= levels.length) {
                    unlockedLevel = nextLevelNum;
                    localStorage.setItem('dragonEggsUnlockedLevel', unlockedLevel);
                }
            }
        });

    </script>
</body>
</html>
