<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eggs of the Dragon: Level 3 - Magma Chambers</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            background-color: #1a1a2e;
            color: #ecf0f1;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
        }

        #game-container {
            border: 8px solid #2d3748;
            background-color: #2c3e50;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 10px rgba(142, 68, 173, 0.5);
            border-radius: 12px;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: -55px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px black;
        }

        .stat-box {
            padding: 8px 18px;
            background: linear-gradient(180deg, #34495e, #2c3e50);
            border: 2px solid #7f8c8d;
            border-radius: 6px;
            color: #f1c40f;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        #dungeon-box {
            color: #bdc3c7;
        }

        #mute-btn {
            padding: 8px 14px;
            background: linear-gradient(180deg, #34495e, #2c3e50);
            border: 2px solid #7f8c8d;
            border-radius: 6px;
            color: #ecf0f1;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        #mute-btn:hover {
            background: linear-gradient(180deg, #415b76, #34495e);
            transform: scale(1.05);
        }

        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .menu-text {
            font-size: 42px;
            color: #e74c3c;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px #000;
        }

        .sub-text {
            font-size: 18px;
            color: #bdc3c7;
            margin-bottom: 5px;
            text-align: center;
        }

        button.main-btn {
            margin-top: 30px;
            padding: 12px 25px;
            font-size: 20px;
            font-weight: bold;
            background-color: #27ae60;
            color: white;
            border: 2px solid #2ecc71;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }

        button.main-btn:hover {
            background-color: #2ecc71;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <radialGradient id="goldGrad" cx="30%" cy="30%" r="65%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="20%" stop-color="#fff59d"/>
                <stop offset="50%" stop-color="#f1c40f"/>
                <stop offset="75%" stop-color="#d35400"/>
                <stop offset="100%" stop-color="#111111"/>
            </radialGradient>
        </defs>
        <symbol id="golden-egg-svg" viewBox="0 0 100 120">
            <ellipse cx="50" cy="60" rx="35" ry="50" fill="url(#goldGrad)" />
            <path d="M42,42 Q50,49 58,42" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="3" stroke-linecap="round"/>
            <path d="M28,62 Q36,69 44,62" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="3" stroke-linecap="round"/>
            <path d="M56,62 Q64,69 72,62" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="3" stroke-linecap="round"/>
            <path d="M42,82 Q50,89 58,82" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="3" stroke-linecap="round"/>
        </symbol>
    </svg>

    <div id="game-wrapper">
        <div id="ui">
                       
            <div style="display: flex; align-items: center; gap: 0;">
        <div class="stat-box" style="border-top-right-radius: 0; border-bottom-right-radius: 0; border-right: none;">Eggs: <span id="egg-count">0</span> / 6</div>
        <div class="stat-box" id="dungeon-box" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">Level 3</div>
    </div>
    
    <!-- Orta Grup: Altın Yumurtalar -->
    <div id="golden-eggs" style="display: flex; gap: 5px; align-items: center;"></div>

    <!-- Sağ Grup: Ses Butonu -->
    <button id="mute-btn" onclick="toggleMute()" title="Ses Aç/Kapat">🔊</button>
</div>
        
        <div id="game-container">
            <canvas id="gameCanvas" width="600" height="600"></canvas>
        </div>

        <div id="overlay-screen">
            <div class="menu-text" id="title-text">LEVEL 3 : MAGMA CHAMBERS</div>
            <div class="sub-text" id="desc-text1">Hey hero, watch out for the lava</div>
            <div class="sub-text" id="desc-text2">Collect the 6 scaly dragon eggs in the Magma Chambers</div>
            <div class="sub-text" id="desc-text3">Movement: Arrow Keys or W, A, S, D</div>
            
            <div id="win-egg-icon" style="width: 100px; height: 120px; display: none; margin-top: 15px; filter: drop-shadow(0 0 25px gold);">
                <svg width="100%" height="100%"><use href="#golden-egg-svg"></use></svg>
            </div>
            
            <button class="main-btn" id="start-btn" onclick="startGame()">Start Level 3</button>
        </div>
    </div>

    <script>
        // --- GAME STATE ---
        let currentLevel = 3; // Bölüm Level 3: Magma Chambers

        // --- DYNAMIC MAGMA MECHANIC STATE ---
        // Haritada lav kanalları olarak belirlenen zemin ('0') koordinatları
        const magmaTilePoints = [
            {x: 7, y: 3}, {x: 7, y: 4}, // Orta dikey
            {x: 7, y: 10}, {x: 7, y: 11},
            {x: 3, y: 7}, {x: 4, y: 7}, {x: 10, y: 7}, {x: 11, y: 7}, // Orta yatay
            {x: 2, y: 5}, {x: 2, y: 9}, {x: 12, y: 5}, {x: 12, y: 9}, // Portal erişim yolları
        ];
        let magmaActive = false;
        let magmaToggleTimer = 0;
        const magmaOnDuration = 250; // Döngü sayısı
        const magmaOffDuration = 350; 

        // --- SOUND ENGINE (Web Audio API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let isMuted = false;

        function toggleMute() {
            isMuted = !isMuted;
            const muteBtn = document.getElementById('mute-btn');
            if (isMuted) {
                muteBtn.innerText = "🔇";
                muteBtn.style.color = "#e74c3c";
            } else {
                muteBtn.innerText = "🔊";
                muteBtn.style.color = "#ecf0f1";
            }
        }
        
        function playTone(freq, type, duration, vol = 0.1) {
            if (isMuted) return;
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        let bgmInterval;
        let bgmStep = 0;

        const sfx = {
            start: () => {
                playTone(261.63, 'square', 0.1, 0.1); 
                setTimeout(() => playTone(329.63, 'square', 0.1, 0.1), 100); 
                setTimeout(() => playTone(392.00, 'square', 0.1, 0.1), 200); 
                setTimeout(() => playTone(523.25, 'square', 0.3, 0.15), 300); 
            },
            collect: () => {
                playTone(587.33, 'triangle', 0.1, 0.2); 
                setTimeout(() => playTone(880.00, 'square', 0.2, 0.15), 80); 
            },
            caught: () => {
                const dropNotes = [220, 185, 146.83, 110, 82.41, 65.41];
                dropNotes.forEach((freq, index) => {
                    setTimeout(() => {
                        playTone(freq, 'sawtooth', index === dropNotes.length - 1 ? 0.7 : 0.15, 0.25);
                    }, index * 90);
                });
            },
            win: () => {
                const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50]; 
                notes.forEach((freq, index) => {
                    setTimeout(() => {
                        playTone(freq, 'square', index === notes.length - 1 ? 0.5 : 0.12, 0.18);
                    }, index * 120);
                });
            },
            // --- LEVEL 3 ÖZEL SOUND BACKGROUND ---
            // Melodi yerine fokurdayan magma uğultusu üretir
            startBGM: () => {
                if (audioCtx) audioCtx.close();
                audioCtx = new AudioContext();
                
                const rumbleFreq = 45; // Düşük uğultu
                const bubbleFreq = 90; // Fokurdama

                const createRumble = () => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(rumbleFreq, audioCtx.currentTime);
                    
                    gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    // Sürekli çalar, startGame içinde clearInterval yerine audioCtx.close() kullanılır
                };

                const playBubble = () => {
                    if (!isPlaying || isMuted) return;
                    // Rastgele fokurdama sesleri
                    const freq = bubbleFreq + (Math.random() * 30 - 15);
                    playTone(freq, 'triangle', 0.4 + Math.random()*0.3, 0.03 + Math.random()*0.02);
                };

                rumbleInterval = setInterval(createRumble, 2000); 
                bgmInterval = setInterval(playBubble, 700); 

                // İlk sesleri başlat
                createRumble();
            },
            stopBGM: () => {
                clearInterval(bgmInterval);
                clearInterval(rumbleInterval);
                if (audioCtx) audioCtx.close(); // audioCtx'i tamamen kapat
                audioCtx = null;
            }
        };
        let rumbleInterval; // Magma uğultusu için ayrı kontrol
        // ------------------------------------

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // --- LEVEL 3: MAGMA CHAMBERS LAYOUT ---
        // Labirent şekli değiştirildi, portallar ('P') dört köşeden farklı yerlere alındı.
        const mapLayout = [
            "111111111111111",
            "100000000000001",
            "101111101111101",
            "101100010001101",
            "101101111101101",
            "1P11000100011P1",
            "101111010111101",
            "100000000000001",
            "101111010111101",
            "1P11000100011P1",
            "101101111101101",
            "101100010001101",
            "101111101111101",
            "100000000000001",
            "111111111111111"
        ];

        const rows = mapLayout.length;
        const cols = mapLayout[0].length;
        const tileSize = canvas.width / cols;

        let hobbit = { x: 7, y: 7 }; // Hobbit ortada başlar
        let dragon = { x: 1, y: 1 }; // Ejderha köşede başlar
        let eggs = [];
        const totalEggs = 6; // Level 3: 6 yumurta
        let eggsCollected = 0;
        
        let isPlaying = false;
        let dragonInterval;
        let dragonSpeed = 380; // Ejderha Level 2'ye göre biraz daha hızlı
        let animationTime = 0; 

        let dragonFire = {
            active: false,
            timer: 0,
            nextFireIn: 100
        };

        const colors = {
            floor: '#2c3e50',
            dragon: '#c0392b',
            magmaBase: '#e74c3c', // Lav rengi
            magmaGlow: '#f1c40f'
        };

        const eggColors = ['#f1c40f', '#3498db', '#e74c3c', '#2ecc71', '#9b59b6', '#e67e22'];

        window.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
            
            let nx = hobbit.x;
            let ny = hobbit.y;

            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') ny--;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') ny++;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') nx--;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') nx++;

            if (mapLayout[ny][nx] !== '1') {
                hobbit.x = nx;
                hobbit.y = ny;
                checkInteractions(); // Portal/Yumurta/Hasar kontrolü
            }
        });

        // --- UI FUNKSİYONLARI ---
        
        // Üst paneldeki altın yumurta listesini günceller
        function updateGoldenEggsUI(targetCount = null) {
            const container = document.getElementById('golden-eggs');
            container.innerHTML = ''; // Temizle

            // Eğer targetCount belirtilmemişse, mevcut currentLevel-1 kadar göster.
            // Level 3 başlangıcında targetCount=2 olacak.
            const completedLevels = targetCount !== null ? targetCount : (currentLevel - 1);
            
            for (let i = 0; i < completedLevels; i++) {
                const eggDiv = document.createElement('div');
                eggDiv.style.width = '28px';
                eggDiv.style.height = '34px';
                eggDiv.style.filter = 'drop-shadow(0 0 8px gold)';
                eggDiv.innerHTML = '<svg width="100%" height="100%"><use href="#golden-egg-svg"></use></svg>';
                container.appendChild(eggDiv);
            }
        }

        // --- OYUN MANTIĞI ---

        function startGame() {
            // Level 3 için UI'ı ilk açılışta 2 yumurta ile güncelle
            document.getElementById('dungeon-box').innerText = "Level 3";
            updateGoldenEggsUI(2); // Başlangıçta 2 altın yumurta
            document.getElementById('egg-count').innerText = eggsCollected;
            document.getElementById('start-btn').innerText = "Start Level 3";

            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            sfx.start();
            sfx.startBGM(); // Magma sound

            document.getElementById('overlay-screen').style.display = 'none';
            document.getElementById('win-egg-icon').style.display = 'none';

            hobbit = { x: 7, y: 7 };
            dragon = { x: 1, y: 1 };
            eggsCollected = 0;
            document.getElementById('egg-count').innerText = eggsCollected;
            
            dragonFire.active = false;
            dragonFire.nextFireIn = 120;
            magmaActive = false;
            magmaToggleTimer = magmaOffDuration; // Lav kapalı başlar

            spawnEggs();
            
            isPlaying = true;
            clearInterval(dragonInterval);
            dragonInterval = setInterval(moveDragon, dragonSpeed);
        }

        function endGame(won) {
            isPlaying = false;
            dragonFire.active = false;
            clearInterval(dragonInterval);
            sfx.stopBGM();
            
            if (won) sfx.win();
            else sfx.caught();

            const overlay = document.getElementById('overlay-screen');
            const title = document.getElementById('title-text');
            const desc1 = document.getElementById('desc-text1');
            const desc2 = document.getElementById('desc-text2');
            const desc3 = document.getElementById('desc-text3');
            const winEggIcon = document.getElementById('win-egg-icon');
            const btn = document.getElementById('start-btn');

            overlay.style.display = 'flex';
            if (won) {

            window.parent.postMessage({ type: 'level_completed', levelNumber: 3 }, '*');

                title.innerText = 'LEVEL 3 COMPLETED!';
                title.style.color = '#f1c40f';
                desc1.innerText = 'You secured all Magma Eggs!';
                desc2.innerText = 'You won a third Golden Dragon Egg!';
                desc3.innerText = 'Movement: Arrow Keys or W, A, S, D';
                winEggIcon.style.display = 'block'; // Win ekranında altın yumurta ikonunu göster
                
                // İlerlemeyi gösterişli altın yumurta ile UI'da göster (Kazanınca 3 tane)
                updateGoldenEggsUI(3);
                
                currentLevel++; // Level 4'e geçişi tetikler

                btn.innerText = 'Start Level ' + currentLevel;
                
                // Butona basıldığında bir sonraki level dosyasına gitmesini sağlar
                btn.onclick = function() {
                    if (currentLevel <= 10) {
                        window.location.href = "LEVEL" + currentLevel + ".html";
                    } else {
                        window.location.href = "LEVEL1.html"; // 10 bittiyse başa dön
                    }
                };

                // UI'ı başlangıçtaki 2 yumurta durumuna geri döndür (eğer win ekranında 3 olmuşsa)
                updateGoldenEggsUI(2);

            } else {
                title.innerText = 'CAUGHT!';
                title.style.color = '#c0392b';
                desc1.innerText = 'The Magma Chambers claim another victim...';
                desc2.innerText = `Eggs Collected: ${eggsCollected} / 6`;
                desc3.innerText = 'Movement: Arrow Keys or W, A, S, D';
                winEggIcon.style.display = 'none';
                
                

                btn.innerText = 'Try Level 3 Again';
            }
        }

        function spawnEggs() {
            eggs = [];
            let validSpots = [];
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    // Magma karosu olmayan boş zeminler
                    const isMagmaTile = magmaTilePoints.some(p => p.x === x && p.y === y);
                    if (mapLayout[y][x] === '0' && !(x === 7 && y === 7) && !(x === 1 && y === 1) && !isMagmaTile) {
                        validSpots.push({x, y});
                    }
                }
            }

            validSpots.sort(() => Math.random() - 0.5);
            for (let i = 0; i < totalEggs; i++) {
                eggs.push({
                    x: validSpots[i].x,
                    y: validSpots[i].y,
                    color: eggColors[i]
                });
            }
        }

        function checkInteractions() {
            // --- HASAR MEKANİĞİ (MEKANİK: LAV BASMA) ---
            // Hobbit hareket ettikten hemen sonra, bastığı yer aktif lav ise anında yakalanır.
            const isOnMagmaTile = magmaTilePoints.some(p => p.x === hobbit.x && p.y === hobbit.y);
            if (magmaActive && isOnMagmaTile) {
                // Lav basma hasarı = caught efekti
                endGame(false);
                return; // Diğer kontrolleri atla
            }

            for (let i = 0; i < eggs.length; i++) {
                if (hobbit.x === eggs[i].x && hobbit.y === eggs[i].y) {
                    sfx.collect(); 
                    eggs.splice(i, 1); 
                    eggsCollected++;
                    document.getElementById('egg-count').innerText = eggsCollected;
                    
                    if (eggsCollected === totalEggs) {
                        endGame(true); 
                        return;
                    }
                    break;
                }
            }

            // --- YENİ PORTAL KONUMLARI İÇİN TELEPORT ---
            if (mapLayout[hobbit.y][hobbit.x] === 'P') {
                if (hobbit.x === 1 && hobbit.y === 5) { hobbit.x = 13; hobbit.y = 9; }
                else if (hobbit.x === 13 && hobbit.y === 9) { hobbit.x = 1; hobbit.y = 5; }
                else if (hobbit.x === 13 && hobbit.y === 5) { hobbit.x = 1; hobbit.y = 9; }
                else if (hobbit.x === 1 && hobbit.y === 9) { hobbit.x = 13; hobbit.y = 5; }
            }

            if (hobbit.x === dragon.x && hobbit.y === dragon.y) {
                endGame(false);
            }
        }

        function moveDragon() {
            if (!isPlaying) return;

            if (dragon.x === hobbit.x && dragon.y === hobbit.y) {
                endGame(false);
                return;
            }

            let queue = [[{ x: dragon.x, y: dragon.y }]];
            let visited = new Set();
            visited.add(`${dragon.x},${dragon.y}`);
            
            let dirs = [{x:0,y:-1}, {x:0,y:1}, {x:-1,y:0}, {x:1,y:0}]; 
            let nextMove = null;

            while (queue.length > 0) {
                let path = queue.shift();
                let curr = path[path.length - 1];

                if (curr.x === hobbit.x && curr.y === hobbit.y) {
                    nextMove = path[1]; 
                    break;
                }

                for (let d of dirs) {
                    let nx = curr.x + d.x;
                    let ny = curr.y + d.y;

                    // Ejderha duvarlara çarpmaz, ama lav üzerinden geçebilir (canı yanmaz)
                    if (nx >= 0 && ny >= 0 && nx < cols && ny < rows && mapLayout[ny][nx] !== '1' && !visited.has(`${nx},${ny}`)) {
                        visited.add(`${nx},${ny}`);
                        queue.push([...path, { x: nx, y: ny }]);
                    }
                }
            }

            if (nextMove) {
                dragon.x = nextMove.x;
                dragon.y = nextMove.y;
            }

            if (dragon.x === hobbit.x && dragon.y === hobbit.y) {
                endGame(false);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Floor and Castles
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let px = x * tileSize;
                    let py = y * tileSize;

                    if (mapLayout[y][x] === '1') {
                        ctx.fillStyle = '#4a5568'; 
                        ctx.fillRect(px, py, tileSize, tileSize);
                        
                        ctx.strokeStyle = '#2d3748'; 
                        ctx.lineWidth = 2;
                        
                        ctx.beginPath();
                        ctx.moveTo(px, py + tileSize / 3);
                        ctx.lineTo(px + tileSize, py + tileSize / 3);
                        ctx.moveTo(px, py + (tileSize * 2) / 3);
                        ctx.lineTo(px + tileSize, py + (tileSize * 2) / 3);
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.moveTo(px + tileSize / 3, py);
                        ctx.lineTo(px + tileSize / 3, py + tileSize / 3);
                        
                        ctx.moveTo(px + (tileSize * 2) / 3, py + tileSize / 3);
                        ctx.lineTo(px + (tileSize * 2) / 3, py + (tileSize * 2) / 3);
                        
                        ctx.moveTo(px + tileSize / 2, py + (tileSize * 2) / 3);
                        ctx.lineTo(px + tileSize / 2, py + tileSize);
                        ctx.stroke();

                        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                        ctx.fillRect(px, py, tileSize, tileSize / 6);

                    } else if (mapLayout[y][x] === 'P') {
                        // Portallar artık köşede değil, zemin rengi sky blue olarak kalır (talep edilmedi)
                        ctx.fillStyle = '#87CEEB'; 
                        ctx.fillRect(px, py, tileSize, tileSize);
                        
                        ctx.fillStyle = '#8e44ad';
                        ctx.beginPath();
                        ctx.arc(px + tileSize / 2, py + tileSize / 2, tileSize / 2.2, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = '#9b59b6';
                        ctx.beginPath();
                        ctx.arc(px + tileSize / 2, py + tileSize / 2, tileSize / 3, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                        ctx.beginPath();
                        ctx.arc(px + tileSize / 2, py + tileSize / 2, tileSize / 8, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.strokeStyle = '#7f8c8d';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.arc(px + tileSize / 2, py + tileSize / 2, tileSize / 2.2, Math.PI, 0);
                        ctx.stroke();

                    } else {
                        // --- KONSEPT: LAV AKINTILARI VE MEKANİK: ZAMANLAMA ---
                        // Magma karosu ise ve aktif ise lav olarak çiz
                        const isMagmaTile = magmaTilePoints.some(p => p.x === x && p.y === y);
                        
                        if (isMagmaTile && magmaActive) {
                            // Aktif Lav Çizimi (Glowing pulsating magma)
                            let glowPulse = 5 + Math.sin(animationTime * 2) * 5; // Pulsating glow
                            ctx.shadowBlur = 10 + glowPulse;
                            ctx.shadowColor = colors.magmaGlow;

                            ctx.fillStyle = colors.magmaBase;
                            ctx.fillRect(px, py, tileSize, tileSize);

                            let magmaGrad = ctx.createRadialGradient(px + tileSize/2, py + tileSize/2, 2, px + tileSize/2, py + tileSize/2, tileSize/1.5);
                            magmaGrad.addColorStop(0, colors.magmaGlow);
                            magmaGrad.addColorStop(0.5, colors.magmaBase);
                            magmaGrad.addColorStop(1, '#a04000'); // Koyu kırmızı-turuncu kenar

                            ctx.fillStyle = magmaGrad;
                            ctx.beginPath();
                            // Lav dokusu kabarcıkları
                            ctx.arc(px + tileSize / 2 + Math.random()*4-2, py + tileSize / 2 + Math.random()*4-2, tileSize / 2.5, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.shadowBlur = 0; // Shadow'u sıfırla

                        } else {
                            // Normal zemin çizimi (Magma kanalı kapalı iken)
                            ctx.fillStyle = colors.floor;
                            ctx.fillRect(px, py, tileSize, tileSize);
                            ctx.fillStyle = 'rgba(0,0,0,0.1)';
                            ctx.fillRect(px + 10, py + 10, 4, 4);
                            ctx.fillRect(px + 25, py + 25, 3, 3);
                            
                            // Magma kanalı kapalı iken hafif bir kırmızı iz bırak (Zamanlama için ipucu)
                            if (isMagmaTile) {
                                ctx.fillStyle = 'rgba(231, 76, 60, 0.06)';
                                ctx.fillRect(px+5, py+5, tileSize-10, tileSize-10);
                            }
                        }
                    }
                }
            }

            // 2. Draw Hovering Dragon Eggs
            eggs.forEach((egg, index) => {
                let cx = egg.x * tileSize + tileSize / 2;
                let floatOffset = Math.sin(animationTime + index) * 6; 
                let cy = (egg.y * tileSize + tileSize / 2) + floatOffset;
                
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                let shadowSize = 10 - (floatOffset / 2);
                ctx.ellipse(cx, egg.y * tileSize + tileSize - 8, shadowSize, shadowSize / 2, 0, 0, Math.PI * 2);
                ctx.fill();

                let gradient = ctx.createRadialGradient(cx - 5, cy - 5, 2, cx, cy, tileSize / 2);
                gradient.addColorStop(0, '#ffffff'); 
                gradient.addColorStop(0.3, egg.color); 
                gradient.addColorStop(1, '#111'); 
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.ellipse(cx, cy, tileSize/3, tileSize/2.2, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(cx, cy - 6, 4, 0, Math.PI); 
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(cx - 6, cy + 2, 4, 0, Math.PI); 
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(cx + 6, cy + 2, 4, 0, Math.PI); 
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(cx, cy + 10, 4, 0, Math.PI); 
                ctx.stroke();
            });

            // 3. Draw EPIC Hero Player
            let hx = hobbit.x * tileSize + tileSize / 2;
            let hy = hobbit.y * tileSize + tileSize / 2;

            // Flowing Elf Cloak
            ctx.fillStyle = '#1e8449'; 
            ctx.beginPath();
            ctx.moveTo(hx, hy - 12);
            ctx.lineTo(hx - 16, hy + 14); 
            ctx.lineTo(hx - 5, hy + 16);
            ctx.lineTo(hx + 5, hy + 15);
            ctx.lineTo(hx + 14, hy + 13);
            ctx.fill();

            // Mithril Shirt
            ctx.fillStyle = '#bdc3c7'; 
            ctx.beginPath();
            ctx.moveTo(hx - 7, hy - 4);
            ctx.lineTo(hx + 7, hy - 4);
            ctx.lineTo(hx + 9, hy + 10);
            ctx.lineTo(hx - 9, hy + 10);
            ctx.fill();
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(hx - 5, hy); ctx.lineTo(hx + 5, hy);
            ctx.moveTo(hx - 6, hy + 4); ctx.lineTo(hx + 6, hy + 4);
            ctx.moveTo(hx - 7, hy + 8); ctx.lineTo(hx + 7, hy + 8);
            ctx.stroke();

            // Elven Brooch
            ctx.fillStyle = '#2ecc71';
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(hx - 4, hy - 4, 2.5, 4, Math.PI/4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Big Hobbit Feet
            ctx.fillStyle = '#e6ba95';
            ctx.beginPath();
            ctx.ellipse(hx - 7, hy + 14, 5, 3, 0, 0, Math.PI * 2);
            ctx.ellipse(hx + 7, hy + 14, 5, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#4e342e'; 
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(hx - 8, hy + 13); ctx.lineTo(hx - 6, hy + 13);
            ctx.moveTo(hx + 6, hy + 13); ctx.lineTo(hx + 8, hy + 13);
            ctx.stroke();

            // Head
            let headGrad = ctx.createRadialGradient(hx - 2, hy - 13, 1, hx, hy - 11, 8);
            headGrad.addColorStop(0, '#f5deb3');
            headGrad.addColorStop(1, '#d2a679');
            ctx.fillStyle = headGrad;
            ctx.beginPath();
            ctx.arc(hx, hy - 11, 7, 0, Math.PI * 2);
            ctx.fill();

            // Eyes 
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.arc(hx - 3, hy - 12, 1.5, 0, Math.PI*2);
            ctx.arc(hx + 3, hy - 12, 1.5, 0, Math.PI*2);
            ctx.fill();

            // Kızıl Saç
            ctx.fillStyle = '#d35400'; 
            ctx.beginPath();
            ctx.arc(hx, hy - 14, 8, Math.PI, 0); 
            ctx.arc(hx - 7, hy - 10, 4, 0, Math.PI * 2); 
            ctx.arc(hx + 7, hy - 10, 4, 0, Math.PI * 2); 
            ctx.arc(hx - 4, hy - 17, 3, 0, Math.PI * 2); 
            ctx.fill();

            // Left Arm - Red & Blue Zig-Zag Shield
            ctx.save();
            ctx.beginPath();
            ctx.arc(hx - 12, hy + 2, 7, 0, Math.PI * 2);
            ctx.clip(); 

            ctx.fillStyle = '#2980b9';
            ctx.fillRect(hx - 20, hy - 6, 16, 16);

            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 2.5;
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            ctx.moveTo(hx - 19, hy - 2);
            ctx.lineTo(hx - 16, hy + 2);
            ctx.lineTo(hx - 13, hy - 2);
            ctx.lineTo(hx - 10, hy + 2);
            ctx.lineTo(hx - 7, hy - 2);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(hx - 19, hy + 4);
            ctx.lineTo(hx - 16, hy + 8);
            ctx.lineTo(hx - 13, hy + 4);
            ctx.lineTo(hx - 10, hy + 8);
            ctx.lineTo(hx - 7, hy + 4);
            ctx.stroke();

            ctx.restore(); 

            ctx.strokeStyle = '#7f8c8d';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(hx - 12, hy + 2, 7, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#bdc3c7';
            ctx.beginPath();
            ctx.arc(hx - 12, hy + 2, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Right Arm - Epic Glowing Sword (Sting)
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffff'; 
            ctx.strokeStyle = '#e0f7fa'; 
            ctx.lineWidth = 3.5;
            ctx.lineCap = "round";
            
            ctx.beginPath();
            ctx.moveTo(hx + 10, hy); 
            ctx.lineTo(hx + 22, hy - 12); 
            ctx.stroke();
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(hx + 11, hy - 1); 
            ctx.lineTo(hx + 21, hy - 11);
            ctx.stroke();
            ctx.shadowBlur = 0; 
            
            ctx.strokeStyle = '#f39c12'; 
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(hx + 7, hy - 3);
            ctx.lineTo(hx + 13, hy + 3);
            ctx.stroke();
            
            ctx.strokeStyle = '#8d6e63';
            ctx.beginPath();
            ctx.moveTo(hx + 10, hy);
            ctx.lineTo(hx + 6, hy + 4);
            ctx.stroke();
            
            ctx.fillStyle = '#f39c12';
            ctx.beginPath();
            ctx.arc(hx + 5, hy + 5, 2.5, 0, Math.PI*2);
            ctx.fill();


            // 4. Draw Dragon
            let dx = dragon.x * tileSize + tileSize / 2;
            let dy = dragon.y * tileSize + tileSize / 2;

            ctx.fillStyle = colors.dragon;
            ctx.beginPath();
            ctx.moveTo(dx, dy - 15);
            ctx.lineTo(dx + 15, dy + 10);
            ctx.lineTo(dx - 15, dy + 10);
            ctx.fill();

            ctx.fillStyle = '#8e44ad';
            ctx.beginPath();
            ctx.moveTo(dx - 10, dy - 5);
            ctx.lineTo(dx - 15, dy - 18);
            ctx.lineTo(dx - 5, dy - 10);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(dx + 10, dy - 5);
            ctx.lineTo(dx + 15, dy - 18);
            ctx.lineTo(dx + 5, dy - 10);
            ctx.fill();

            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(dx - 5, dy + 2, 3, 0, Math.PI*2);
            ctx.arc(dx + 5, dy + 2, 3, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.fillRect(dx - 6, dy, 2, 4);
            ctx.fillRect(dx + 4, dy, 2, 4);

            // 5. Draw Dynamic Dragon Fire
            if (dragonFire.active) {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#e74c3c'; 
                
                let fLength = 25 + Math.random() * 20; 
                
                ctx.beginPath();
                ctx.moveTo(dx, dy + 10); 
                
                ctx.lineTo(dx - 8 - Math.random() * 6, dy + 15 + Math.random() * 10);
                ctx.lineTo(dx - 3 + Math.random() * 6, dy + 20 + Math.random() * 10);
                
                ctx.lineTo(dx, dy + 10 + fLength);
                
                ctx.lineTo(dx + 3 - Math.random() * 6, dy + 20 + Math.random() * 10);
                ctx.lineTo(dx + 8 + Math.random() * 6, dy + 15 + Math.random() * 10);
                
                ctx.closePath();
                
                let fireGradient = ctx.createLinearGradient(dx, dy + 10, dx, dy + 10 + fLength);
                fireGradient.addColorStop(0, 'rgba(255, 255, 0, 0.9)');    
                fireGradient.addColorStop(0.4, 'rgba(255, 120, 0, 0.9)');  
                fireGradient.addColorStop(1, 'rgba(255, 0, 0, 0)');        
                
                ctx.fillStyle = fireGradient;
                ctx.fill();
                ctx.restore();
            }
        }

        function gameLoop() {
            animationTime += 0.08; 

            if (isPlaying) {
                // --- MAGMA FLOW LOGIC ---
                // Lav mekaniği: Zamanlama bazlı açılıp kapanma
                magmaToggleTimer--;
                if (magmaToggleTimer <= 0) {
                    magmaActive = !magmaActive; // Lavı aç/kapat
                    magmaToggleTimer = magmaActive ? magmaOnDuration : magmaOffDuration;
                }

                dragonFire.nextFireIn--;
                if (dragonFire.nextFireIn <= 0) {
                    dragonFire.active = true;
                    dragonFire.timer = 45 + Math.floor(Math.random() * 30); 
                    dragonFire.nextFireIn = Math.floor(Math.random() * 180) + 120; 
                }

                if (dragonFire.active) {
                    dragonFire.timer--;
                    if (dragonFire.timer <= 0) {
                        dragonFire.active = false;
                    }
                }
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        // --- HARİCİ UI GÜNCELLEMESİ (STARTUP) ---
        // Oyun açıldığı an, Level 3 başlangıcını ve 2 altın yumurtayı göster
        document.getElementById('dungeon-box').innerText = "Level 3";
        updateGoldenEggsUI(2); // Başlangıçta 2 altın yumurta
        document.getElementById('egg-count').innerText = eggsCollected;
        document.getElementById('start-btn').innerText = "Start Level 3";

        requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
