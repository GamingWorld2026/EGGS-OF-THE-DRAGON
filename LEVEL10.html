<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eggs of the Dragon: Level 10 - Dragon's Lair</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            background-color: #0d0f12; 
            color: #ecf0f1;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
        }

        #game-container {
            border: 8px solid #1a1c23;
            background-color: #0a0c10;
            box-shadow: 0 0 50px rgba(0, 0, 0, 1), 0 0 25px rgba(231, 76, 60, 0.4);
            border-radius: 12px;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: -55px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px black;
        }

        .stat-box {
            padding: 8px 18px;
            background: linear-gradient(180deg, #34495e, #1a1c23);
            border: 2px solid #5d6d7e;
            border-radius: 6px;
            color: #f1c40f;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        #dungeon-box {
            color: #e74c3c;
        }

        #mute-btn {
            padding: 8px 14px;
            background: linear-gradient(180deg, #34495e, #1a1c23);
            border: 2px solid #5d6d7e;
            border-radius: 6px;
            color: #ecf0f1;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.8);
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        #mute-btn:hover {
            background: linear-gradient(180deg, #415b76, #34495e);
            transform: scale(1.05);
        }

        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .menu-text {
            font-size: 42px;
            color: #e74c3c;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 2px 2px 8px #000;
        }

        .sub-text {
            font-size: 18px;
            color: #bdc3c7;
            margin-bottom: 5px;
            text-align: center;
        }

        button.main-btn {
            margin-top: 30px;
            padding: 12px 25px;
            font-size: 20px;
            font-weight: bold;
            background-color: #c0392b;
            color: white;
            border: 2px solid #e74c3c;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: 0.2s;
        }

        button.main-btn:hover {
            background-color: #e74c3c;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <radialGradient id="goldGrad" cx="30%" cy="30%" r="65%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="20%" stop-color="#fff59d"/>
                <stop offset="50%" stop-color="#f1c40f"/>
                <stop offset="75%" stop-color="#d35400"/>
                <stop offset="100%" stop-color="#111111"/>
            </radialGradient>
        </defs>
        <symbol id="golden-egg-svg" viewBox="0 0 100 120">
            <ellipse cx="50" cy="60" rx="35" ry="50" fill="url(#goldGrad)" />
            <path d="M42,42 Q50,49 58,42" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="3" stroke-linecap="round"/>
            <path d="M28,62 Q36,69 44,62" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="3" stroke-linecap="round"/>
            <path d="M56,62 Q64,69 72,62" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="3" stroke-linecap="round"/>
            <path d="M42,82 Q50,89 58,82" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="3" stroke-linecap="round"/>
        </symbol>
    </svg>

    <div id="game-wrapper">
        <div id="ui">
            <div style="display: flex; align-items: center; gap: 0;">
                <div class="stat-box" style="border-top-right-radius: 0; border-bottom-right-radius: 0; border-right: none;">Eggs: <span id="egg-count">0/13</span></div>
                <div class="stat-box" id="dungeon-box" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">Level 10</div>
            </div>
            
            <div id="golden-eggs" style="display: flex; gap: 4px; align-items: center;"></div>

            <button id="mute-btn" onclick="toggleMute()" title="Ses Aç/Kapat">🔊</button>
        </div>
        
        <div id="game-container">
            <canvas id="gameCanvas" width="600" height="600"></canvas>
        </div>

        <div id="overlay-screen">
            <div class="menu-text" id="title-text">LEVEL 10 : DRAGON'S LAIR</div>
            <div class="sub-text" id="desc-text1">Every 15s an egg hatches into a baby dragon—collect them all!</div>
            <div class="sub-text" id="desc-text2">Collect all 13 eggs & baby dragons</div>
            <div class="sub-text" id="desc-text3">Movement: Arrow Keys or W, A, S, D</div>
            
            <div id="win-egg-icon" style="width: 100px; height: 120px; display: none; margin-top: 15px; filter: drop-shadow(0 0 25px gold);">
                <svg width="100%" height="100%"><use href="#golden-egg-svg"></use></svg>
            </div>
            
            <button class="main-btn" id="start-btn" onclick="startGame()">Start Level 10</button>
        </div>
    </div>

    <script>
        // --- GAME STATE ---
        let currentLevel = 10;

        // --- MOVEMENT STATE ---
        let sliding = false;
        let slideDir = {x: 0, y: 0};
        let slideSpeed = 8; 
        let slideFrameCounter = 0;
        let slideDistanceRemaining = 0;
        let maxSlideDistance = 1;

        // --- ENEMY STATE ---
        let ghosts = [
            { active: false, px: 0, py: 0 },
            { active: false, px: 0, py: 0 }
        ];
        let fireballs = [];
        let ghostInterval;
        let fireballInterval;
        let eggHatchInterval;

        // --- SOUND ENGINE (Web Audio API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let isMuted = false;

        function toggleMute() {
            isMuted = !isMuted;
            const muteBtn = document.getElementById('mute-btn');
            
            if (isMuted) {
                muteBtn.innerText = "🔇";
                muteBtn.style.color = "#e74c3c";
                if (audioCtx && audioCtx.state === 'running') {
                    audioCtx.suspend();
                }
            } else {
                muteBtn.innerText = "🔊";
                muteBtn.style.color = "#ecf0f1";
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }
        }
        
        function playTone(freq, type, duration, vol = 0.1) {
            if (isMuted) return;
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        let bgmNodes = null;

        const sfx = {
            start: () => {
                playTone(200.00, 'sawtooth', 0.1, 0.15); 
                setTimeout(() => playTone(300.00, 'sawtooth', 0.1, 0.15), 100); 
                setTimeout(() => playTone(450.00, 'square', 0.2, 0.15), 200); 
                setTimeout(() => playTone(600.00, 'square', 0.4, 0.2), 300); 
            },
            collect: () => {
                playTone(880.00, 'triangle', 0.1, 0.2); 
                setTimeout(() => playTone(1174.66, 'sine', 0.2, 0.15), 80); 
            },
            caught: () => {
                const dropNotes = [220, 185, 146.83, 110, 82.41, 65.41];
                dropNotes.forEach((freq, index) => {
                    setTimeout(() => {
                        playTone(freq, 'sawtooth', index === dropNotes.length - 1 ? 0.7 : 0.15, 0.25);
                    }, index * 90);
                });
            },
            win: () => {
                const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51]; 
                notes.forEach((freq, index) => {
                    setTimeout(() => {
                        playTone(freq, 'square', index === notes.length - 1 ? 0.6 : 0.12, 0.2);
                    }, index * 120);
                });
            },
            startBGM: () => { 
                if (audioCtx) audioCtx.close();
                audioCtx = new AudioContext();

                const breathOsc = audioCtx.createOscillator();
                breathOsc.type = 'sawtooth';
                breathOsc.frequency.value = 45;

                const breathFilter = audioCtx.createBiquadFilter();
                breathFilter.type = 'lowpass';
                breathFilter.frequency.value = 130;

                const breathLfo = audioCtx.createOscillator();
                breathLfo.type = 'sine';
                breathLfo.frequency.value = 0.3;

                const breathLfoGain = audioCtx.createGain();
                breathLfoGain.gain.value = 90;

                breathLfo.connect(breathLfoGain);
                breathLfoGain.connect(breathFilter.frequency);
                breathLfo.start();

                const breathGain = audioCtx.createGain();
                breathGain.gain.value = 0.22;

                breathOsc.connect(breathFilter);
                breathFilter.connect(breathGain);
                breathGain.connect(audioCtx.destination);
                breathOsc.start();

                const stepOsc = audioCtx.createOscillator();
                stepOsc.type = 'triangle';
                stepOsc.frequency.value = 50;

                const stepGain = audioCtx.createGain();
                stepGain.gain.value = 0;

                const stepLfo = audioCtx.createOscillator();
                stepLfo.type = 'square';
                stepLfo.frequency.value = 0.8; 

                stepLfo.connect(stepGain.gain);
                stepLfo.start();

                stepOsc.connect(stepGain);
                stepGain.connect(audioCtx.destination);
                stepOsc.start();

                bgmNodes = { breathOsc, breathLfo, breathLfoGain, breathFilter, breathGain, stepOsc, stepLfo, stepGain };
            },
            stopBGM: () => {
                if (bgmNodes) {
                    if (bgmNodes.breathOsc) bgmNodes.breathOsc.stop();
                    if (bgmNodes.breathLfo) bgmNodes.breathLfo.stop();
                    if (bgmNodes.stepOsc) bgmNodes.stepOsc.stop();
                    if (bgmNodes.stepLfo) bgmNodes.stepLfo.stop();
                }
                if (audioCtx) audioCtx.close();
                audioCtx = null;
            }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const mapLayout = [
            "T111111P111111T",
            "100000101000001",
            "101110101011101",
            "101000000000101",
            "1010P1101100101", 
            "100001000100001",
            "111011010110111",
            "P0000000000000P", 
            "111011010110111",
            "100001000100001",
            "1010001011P0101", 
            "101000000000101",
            "101110101011101",
            "100000101000001",
            "T111111P111111T"
        ];

        const rows = mapLayout.length;
        const cols = mapLayout[0].length;
        const tileSize = canvas.width / cols;

        let hobbit = { x: 7, y: 7 }; 
        
        let dragons = [
            { x: 1, y: 1, fire: { active: true, timer: 0, nextFireIn: 0 } }
        ];
        let eggs = [];
        const totalEggs = 13; 
        let eggsCollected = 0;
        
        let isPlaying = false;
        let dragonInterval;
        let dragonSpeed = 320; 
        let animationTime = 0; 

        const colors = {
            floor: '#120b0c', 
            dragon: '#e74c3c',
            wallBase: '#1a0d0e'
        };

        const eggColors = ['#f1c40f', '#3498db', '#e74c3c', '#2ecc71', '#9b59b6', '#e67e22', '#1abc9c', '#e84393', '#00cec9', '#ffffff', '#ff9f43', '#f368e0', '#ff5252'];

        window.addEventListener('keydown', (e) => {
            if (!isPlaying || sliding) return; 
            
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
            
            let tempDir = {x: 0, y: 0};
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') tempDir = {x: 0, y: -1};
            else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') tempDir = {x: 0, y: 1};
            else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') tempDir = {x: -1, y: 0};
            else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') tempDir = {x: 1, y: 0};
            else return;

            let nx = hobbit.x + tempDir.x;
            let ny = hobbit.y + tempDir.y;

            if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && mapLayout[ny][nx] !== '1' && mapLayout[ny][nx] !== 'T') {
                slideDir = tempDir;
                sliding = true;
                slideDistanceRemaining = maxSlideDistance;
                slideFrameCounter = 0; 
            }
        });

        function updateGoldenEggsUI(targetCount = null) {
            const container = document.getElementById('golden-eggs');
            container.innerHTML = ''; 
            const completedLevels = targetCount !== null ? targetCount : 9;
            
            for (let i = 0; i < completedLevels; i++) {
                const eggDiv = document.createElement('div');
                eggDiv.style.width = '20px';
                eggDiv.style.height = '26px';
                eggDiv.style.filter = 'drop-shadow(0 0 8px gold)';
                eggDiv.innerHTML = '<svg width="100%" height="100%"><use href="#golden-egg-svg"></use></svg>';
                container.appendChild(eggDiv);
            }
        }

        function startGame() {
            document.getElementById('dungeon-box').innerText = `Level ${currentLevel}`;
            updateGoldenEggsUI(9);
            document.getElementById('egg-count').innerText = "0 / " + totalEggs;
            document.getElementById('start-btn').innerText = `Start Level ${currentLevel}`;

            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            sfx.start();
            sfx.startBGM(); 

            document.getElementById('overlay-screen').style.display = 'none';
            document.getElementById('win-egg-icon').style.display = 'none';

            hobbit = { x: 7, y: 7 };
            dragons = [
                { x: 1, y: 1, fire: { active: true, timer: 0, nextFireIn: 0 } }
            ];
            eggsCollected = 0;
            sliding = false;
            
            spawnEggs();
            
            isPlaying = true;
            clearInterval(dragonInterval);
            dragonInterval = setInterval(moveDragons, dragonSpeed);

            clearInterval(ghostInterval);
            ghosts.forEach(g => g.active = false);
            ghostInterval = setInterval(() => {
                if (isPlaying) {
                    ghosts.forEach(ghost => {
                        if (!ghost.active) {
                            ghost.active = true;
                            let corners = [
                                {x: -50, y: -50},
                                {x: canvas.width + 50, y: -50},
                                {x: -50, y: canvas.height + 50},
                                {x: canvas.width + 50, y: canvas.height + 50}
                            ];
                            let spawn = corners[Math.floor(Math.random() * corners.length)];
                            ghost.px = spawn.x + (Math.random() * 20 - 10);
                            ghost.py = spawn.y + (Math.random() * 20 - 10);
                            
                            setTimeout(() => { ghost.active = false; }, 8000);
                        }
                    });
                }
            }, 10000);

            clearInterval(fireballInterval);
            fireballs = [];
            fireballInterval = setInterval(() => {
                if (isPlaying) {
                    let edges = [
                        {x: -20, y: Math.random()*canvas.height, vx: 2.5 + Math.random(), vy: (Math.random()-0.5)*2},
                        {x: canvas.width + 20, y: Math.random()*canvas.height, vx: -2.5 - Math.random(), vy: (Math.random()-0.5)*2},
                        {x: Math.random()*canvas.width, y: -20, vx: (Math.random()-0.5)*2, vy: 2.5 + Math.random()},
                        {x: Math.random()*canvas.width, y: canvas.height + 20, vx: (Math.random()-0.5)*2, vy: -2.5 - Math.random()}
                    ];
                    for(let i=0; i<4; i++) {
                        let edge = edges[i % edges.length]; 
                        fireballs.push({
                            x: edge.x,
                            y: edge.y,
                            vx: edge.vx,
                            vy: edge.vy,
                            active: true
                        });
                    }
                }
            }, 10000);

            // Her 15 saniyede bir SIRASIYLA tek bir yumurtanın çatlaması ve yavru ejderhaya dönüşmesi
            clearInterval(eggHatchInterval);
            eggHatchInterval = setInterval(() => {
                if (isPlaying) {
                    let nextEggToHatch = eggs.find(egg => !egg.hatched);
                    if (nextEggToHatch) {
                        nextEggToHatch.hatched = true;
                    }
                }
            }, 15000);
        }

        function endGame(won, customMessage = null) {
            isPlaying = false;
            sliding = false;
            dragons.forEach(d => d.fire.active = false);
            ghosts.forEach(g => g.active = false);
            fireballs = [];
            clearInterval(dragonInterval);
            clearInterval(ghostInterval);
            clearInterval(fireballInterval);
            clearInterval(eggHatchInterval);
            sfx.stopBGM();
            
            if (won) sfx.win();
            else sfx.caught();

            const overlay = document.getElementById('overlay-screen');
            const title = document.getElementById('title-text');
            const desc1 = document.getElementById('desc-text1');
            const desc2 = document.getElementById('desc-text2');
            const desc3 = document.getElementById('desc-text3');
            const winEggIcon = document.getElementById('win-egg-icon');
            const btn = document.getElementById('start-btn');

            overlay.style.display = 'flex';

            if (won) {

            window.parent.postMessage({ type: 'level_completed', levelNumber: 10 }, '*');

                title.innerText = 'LEVEL 10 COMPLETED!';
                title.style.color = '#f1c40f';
                desc1.innerText = 'VICTORY! You conquered the Dragon\'s Lair!';
                desc2.innerText = 'You won the tenth Golden Dragon Egg!';
                desc3.innerText = 'Congratulations on finishing the game!';
                winEggIcon.style.display = 'block'; 
                
                updateGoldenEggsUI(10);
                
                btn.innerText = 'Play Again';
            } else {
                title.innerText = customMessage || 'CAUGHT!';
                title.style.color = '#c0392b';
                desc1.innerText = 'You were consumed by the Lair...';
                desc2.innerText = `Eggs Collected: ${eggsCollected} / ${totalEggs}`;
                desc3.innerText = 'Movement: Arrow Keys or W, A, S, D';
                winEggIcon.style.display = 'none';
                
                updateGoldenEggsUI(9);

                btn.innerText = 'Try Level 10 Again';
            }
        }

        function spawnEggs() {
            eggs = [];
            let validSpots = [];

            let reachable = new Set();
            let queue = [{x: hobbit.x, y: hobbit.y}];
            reachable.add(`${hobbit.x},${hobbit.y}`);
            let dirs = [{x:0,y:-1}, {x:0,y:1}, {x:-1,y:0}, {x:1,y:0}];

            while (queue.length > 0) {
                let curr = queue.shift();
                
                let px = curr.x, py = curr.y;
                if (mapLayout[py][px] === 'P') {
                    let tx = px, ty = py;
                    if (px === 7 && py === 0) { tx = 7; ty = 14; }
                    else if (px === 7 && py === 14) { tx = 7; ty = 0; }
                    else if (px === 0 && py === 7) { tx = 14; ty = 7; }
                    else if (px === 14 && py === 7) { tx = 0; ty = 7; }
                    else if (px === 4 && py === 4) { tx = 10; ty = 10; }
                    else if (px === 10 && py === 10) { tx = 4; ty = 4; }
                    
                    if (!reachable.has(`${tx},${ty}`)) {
                        reachable.add(`${tx},${ty}`);
                        queue.push({x: tx, y: ty});
                    }
                }

                for (let d of dirs) {
                    let nx = curr.x + d.x;
                    let ny = curr.y + d.y;
                    if (nx >= 0 && ny >= 0 && nx < cols && ny < rows &&
                        mapLayout[ny][nx] !== '1' && mapLayout[ny][nx] !== 'T' &&
                        !reachable.has(`${nx},${ny}`)) {
                        reachable.add(`${nx},${ny}`);
                        queue.push({x: nx, y: ny});
                    }
                }
            }

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (mapLayout[y][x] === '0' && 
                        !(x === 7 && y === 7) && 
                        !(x === 1 && y === 1) && 
                        reachable.has(`${x},${y}`)) {
                        validSpots.push({x, y});
                    }
                }
            }

            for (let i = validSpots.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [validSpots[i], validSpots[j]] = [validSpots[j], validSpots[i]];
            }

            for (let i = 0; i < Math.min(totalEggs, validSpots.length); i++) {
                eggs.push({
                    x: validSpots[i].x,
                    y: validSpots[i].y,
                    color: eggColors[i % eggColors.length],
                    hatched: false
                });
            }
        }

        function checkInteractions() {
            for (let i = 0; i < eggs.length; i++) {
                if (hobbit.x === eggs[i].x && hobbit.y === eggs[i].y) {
                    sfx.collect(); 
                    eggs.splice(i, 1); 
                    eggsCollected++;
                    document.getElementById('egg-count').innerText = `${eggsCollected} / ${totalEggs}`;
                    
                    if (eggsCollected === totalEggs) {
                        endGame(true); 
                        return;
                    }
                    break;
                }
            }

            if (mapLayout[hobbit.y][hobbit.x] === 'P') {
                const px = hobbit.x;
                const py = hobbit.y;
                
                if (px === 7 && py === 0) { hobbit.x = 7; hobbit.y = 14; }
                else if (px === 7 && py === 14) { hobbit.x = 7; hobbit.y = 0; }
                else if (px === 0 && py === 7) { hobbit.x = 14; hobbit.y = 7; }
                else if (px === 14 && py === 7) { hobbit.x = 0; hobbit.y = 7; }
                else if (px === 4 && py === 4) { hobbit.x = 10; hobbit.y = 10; } 
                else if (px === 10 && py === 10) { hobbit.x = 4; hobbit.y = 4; } 

                sliding = false; 
            }

            for (let dragon of dragons) {
                if (hobbit.x === dragon.x && hobbit.y === dragon.y) {
                    endGame(false, 'BURNED BY THE DRAGON!');
                    return;
                }
            }
        }

        function moveDragons() {
            if (!isPlaying) return;

            dragons.forEach(dragon => {
                if (dragon.x === hobbit.x && dragon.y === hobbit.y) {
                    endGame(false, 'BURNED BY THE DRAGON!');
                    return;
                }

                let queue = [[{ x: dragon.x, y: dragon.y }]];
                let visited = new Set();
                visited.add(`${dragon.x},${dragon.y}`);
                
                let dirs = [{x:0,y:-1}, {x:0,y:1}, {x:-1,y:0}, {x:1,y:0}]; 
                let nextMove = null;

                while (queue.length > 0) {
                    let path = queue.shift();
                    let curr = path[path.length - 1];

                    if (curr.x === hobbit.x && curr.y === hobbit.y) {
                        nextMove = path[1]; 
                        break;
                    }

                    for (let d of dirs) {
                        let nx = curr.x + d.x;
                        let ny = curr.y + d.y;

                        if (nx >= 0 && ny >= 0 && nx < cols && ny < rows && mapLayout[ny][nx] !== '1' && mapLayout[ny][nx] !== 'P' && mapLayout[ny][nx] !== 'T' && !visited.has(`${nx},${ny}`)) {
                            visited.add(`${nx},${ny}`);
                            queue.push([...path, { x: nx, y: ny }]);
                        }
                    }
                }

                if (nextMove) {
                    dragon.x = nextMove.x;
                    dragon.y = nextMove.y;
                }

                if (dragon.x === hobbit.x && dragon.y === hobbit.y) {
                    endGame(false, 'BURNED BY THE DRAGON!');
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let px = x * tileSize;
                    let py = y * tileSize;

                    if (mapLayout[y][x] === '1') {
                        ctx.fillStyle = colors.wallBase; 
                        ctx.fillRect(px, py, tileSize, tileSize);
                        
                        ctx.strokeStyle = '#2c1416'; 
                        ctx.lineWidth = 2;
                        
                        ctx.beginPath();
                        ctx.moveTo(px, py + tileSize / 3);
                        ctx.lineTo(px + tileSize, py + tileSize / 3);
                        ctx.moveTo(px, py + (tileSize * 2) / 3);
                        ctx.lineTo(px + tileSize, py + (tileSize * 2) / 3);
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.moveTo(px + tileSize / 3, py);
                        ctx.lineTo(px + tileSize / 3, py + tileSize / 3);
                        
                        ctx.moveTo(px + (tileSize * 2) / 3, py + tileSize / 3);
                        ctx.lineTo(px + (tileSize * 2) / 3, py + (tileSize * 2) / 3);
                        
                        ctx.moveTo(px + tileSize / 2, py + (tileSize * 2) / 3);
                        ctx.lineTo(px + tileSize / 2, py + tileSize);
                        ctx.stroke();

                    } else if (mapLayout[y][x] === 'P') {
                        ctx.fillStyle = '#2980b9'; 
                        ctx.fillRect(px, py, tileSize, tileSize);
                        
                        ctx.fillStyle = '#8e44ad';
                        ctx.beginPath();
                        ctx.arc(px + tileSize / 2, py + tileSize / 2, tileSize / 2.2, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = '#9b59b6';
                        ctx.beginPath();
                        ctx.arc(px + tileSize / 2, py + tileSize / 2, tileSize / 3, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                        ctx.beginPath();
                        ctx.arc(px + tileSize / 2, py + tileSize / 2, tileSize / 8, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.strokeStyle = '#5d6d7e';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.arc(px + tileSize / 2, py + tileSize / 2, tileSize / 2.2, Math.PI, 0);
                        ctx.stroke();

                    } else if (mapLayout[y][x] === 'T') {
                        ctx.fillStyle = colors.floor;
                        ctx.fillRect(px, py, tileSize, tileSize);
                        
                        ctx.fillStyle = '#4a235a';
                        ctx.fillRect(px + tileSize/2 - 3, py + tileSize/2, 6, 16);
                        
                        let fireY = py + tileSize/2 - 4 + Math.sin(animationTime * 12 + x) * 2;
                        ctx.fillStyle = '#ff3300';
                        ctx.beginPath();
                        ctx.arc(px + tileSize/2, fireY, 9, 0, Math.PI*2);
                        ctx.fill();
                        
                        ctx.fillStyle = '#ffcc00';
                        ctx.beginPath();
                        ctx.arc(px + tileSize/2, fireY, 4, 0, Math.PI*2);
                        ctx.fill();
                        
                        ctx.globalCompositeOperation = 'screen';
                        let tGrad = ctx.createRadialGradient(px + tileSize/2, py + tileSize/2, 5, px + tileSize/2, py + tileSize/2, tileSize * 2.8);
                        tGrad.addColorStop(0, 'rgba(255, 69, 0, 0.6)');
                        tGrad.addColorStop(1, 'rgba(255, 69, 0, 0)');
                        ctx.fillStyle = tGrad;
                        ctx.beginPath();
                        ctx.arc(px + tileSize/2, py + tileSize/2, tileSize * 2.8, 0, Math.PI*2);
                        ctx.fill();
                        ctx.globalCompositeOperation = 'source-over';
                        
                    } else {
                        ctx.fillStyle = colors.floor;
                        ctx.fillRect(px, py, tileSize, tileSize);
                        
                        ctx.fillStyle = 'rgba(255,255,255,0.02)';
                        ctx.beginPath();
                        ctx.moveTo(px + 5, py + 5);
                        ctx.lineTo(px + 20, py + 5);
                        ctx.lineTo(px + 15, py + 10);
                        ctx.lineTo(px + 5, py + 10);
                        ctx.fill();
                    }
                }
            }

            // Yumurtalar veya Çatlayıp Kahramanın Toplayabileceği Yavru Ejderhalar
            eggs.forEach((egg, index) => {
                let cx = egg.x * tileSize + tileSize / 2;
                let floatOffset = Math.sin(animationTime * 3 + index) * 4; 
                let cy = (egg.y * tileSize + tileSize / 2) + floatOffset;

                if (egg.hatched) {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.beginPath();
                    ctx.ellipse(cx, egg.y * tileSize + tileSize - 6, 8, 3, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = egg.color;
                    ctx.beginPath();
                    ctx.arc(cx, cy + 2, 7, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(cx, cy - 5, 5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(cx - 2, cy - 6, 1.8, 0, Math.PI * 2);
                    ctx.arc(cx + 2, cy - 6, 1.8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(cx - 2, cy - 6, 0.8, 0, Math.PI * 2);
                    ctx.arc(cx + 2, cy - 6, 0.8, 0, Math.PI * 2);
                    ctx.fill();

                    let wingFlap = Math.sin(animationTime * 12 + index) * 4;
                    ctx.fillStyle = '#e74c3c';
                    ctx.beginPath();
                    ctx.moveTo(cx - 5, cy - 1);
                    ctx.lineTo(cx - 12, cy - 6 + wingFlap);
                    ctx.lineTo(cx - 7, cy + 4);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(cx + 5, cy - 1);
                    ctx.lineTo(cx + 12, cy - 6 + wingFlap);
                    ctx.lineTo(cx + 7, cy + 4);
                    ctx.fill();

                } else {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.beginPath();
                    let shadowSize = 10 - (floatOffset / 2);
                    ctx.ellipse(cx, egg.y * tileSize + tileSize - 8, shadowSize, shadowSize / 2, 0, 0, Math.PI * 2);
                    ctx.fill();

                    let gradient = ctx.createRadialGradient(cx - 5, cy - 5, 2, cx, cy, tileSize / 2);
                    gradient.addColorStop(0, '#ffffff'); 
                    gradient.addColorStop(0.3, egg.color); 
                    gradient.addColorStop(1, '#111'); 
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, tileSize/3, tileSize/2.2, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(cx, cy - 6, 4, 0, Math.PI); 
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.arc(cx - 6, cy + 2, 4, 0, Math.PI); 
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.arc(cx + 6, cy + 2, 4, 0, Math.PI); 
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.arc(cx, cy + 10, 4, 0, Math.PI); 
                    ctx.stroke();
                }
            });

            // Kahraman
            let hx = hobbit.x * tileSize + tileSize / 2;
            let hy = hobbit.y * tileSize + tileSize / 2;

            ctx.globalCompositeOperation = 'screen';
            let pGrad = ctx.createRadialGradient(hx, hy, 0, hx, hy, tileSize * 2);
            pGrad.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
            pGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = pGrad;
            ctx.beginPath();
            ctx.arc(hx, hy, tileSize * 2, 0, Math.PI*2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            ctx.fillStyle = '#1e8449'; 
            ctx.beginPath();
            ctx.moveTo(hx, hy - 12);
            ctx.lineTo(hx - 16, hy + 14); 
            ctx.lineTo(hx - 5, hy + 16);
            ctx.lineTo(hx + 5, hy + 15);
            ctx.lineTo(hx + 14, hy + 13);
            ctx.fill();

            ctx.fillStyle = '#bdc3c7'; 
            ctx.beginPath();
            ctx.moveTo(hx - 7, hy - 4);
            ctx.lineTo(hx + 7, hy - 4);
            ctx.lineTo(hx + 9, hy + 10);
            ctx.lineTo(hx - 9, hy + 10);
            ctx.fill();
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(hx - 5, hy); ctx.lineTo(hx + 5, hy);
            ctx.moveTo(hx - 6, hy + 4); ctx.lineTo(hx + 6, hy + 4);
            ctx.moveTo(hx - 7, hy + 8); ctx.lineTo(hx + 7, hy + 8);
            ctx.stroke();

            ctx.fillStyle = '#2ecc71';
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(hx - 4, hy - 4, 2.5, 4, Math.PI/4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#e6ba95';
            ctx.beginPath();
            ctx.ellipse(hx - 7, hy + 14, 5, 3, 0, 0, Math.PI * 2);
            ctx.ellipse(hx + 7, hy + 14, 5, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#4e342e'; 
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(hx - 8, hy + 13); ctx.lineTo(hx - 6, hy + 13);
            ctx.moveTo(hx + 6, hy + 13); ctx.lineTo(hx + 8, hy + 13);
            ctx.stroke();

            let headGrad = ctx.createRadialGradient(hx - 2, hy - 13, 1, hx, hy - 11, 8);
            headGrad.addColorStop(0, '#f5deb3');
            headGrad.addColorStop(1, '#d2a679');
            ctx.fillStyle = headGrad;
            ctx.beginPath();
            ctx.arc(hx, hy - 11, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.arc(hx - 3, hy - 12, 1.5, 0, Math.PI*2);
            ctx.arc(hx + 3, hy - 12, 1.5, 0, Math.PI*2);
            ctx.fill();

            ctx.fillStyle = '#d35400'; 
            ctx.beginPath();
            ctx.arc(hx, hy - 14, 8, Math.PI, 0); 
            ctx.arc(hx - 7, hy - 10, 4, 0, Math.PI * 2); 
            ctx.arc(hx + 7, hy - 10, 4, 0, Math.PI * 2); 
            ctx.arc(hx - 4, hy - 17, 3, 0, Math.PI * 2); 
            ctx.fill();

            ctx.save();
            ctx.beginPath();
            ctx.arc(hx - 12, hy + 2, 7, 0, Math.PI * 2);
            ctx.clip(); 

            ctx.fillStyle = '#2980b9';
            ctx.fillRect(hx - 20, hy - 6, 16, 16);

            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 2.5;
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            ctx.moveTo(hx - 19, hy - 2);
            ctx.lineTo(hx - 16, hy + 2);
            ctx.lineTo(hx - 13, hy - 2);
            ctx.lineTo(hx - 10, hy + 2);
            ctx.lineTo(hx - 7, hy - 2);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(hx - 19, hy + 4);
            ctx.lineTo(hx - 16, hy + 8);
            ctx.lineTo(hx - 13, hy + 4);
            ctx.lineTo(hx - 10, hy + 8);
            ctx.lineTo(hx - 7, hy + 4);
            ctx.stroke();

            ctx.restore(); 

            ctx.strokeStyle = '#7f8c8d';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(hx - 12, hy + 2, 7, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#bdc3c7';
            ctx.beginPath();
            ctx.arc(hx - 12, hy + 2, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffff'; 
            ctx.strokeStyle = '#e0f7fa'; 
            ctx.lineWidth = 3.5;
            ctx.lineCap = "round";
            
            ctx.beginPath();
            ctx.moveTo(hx + 10, hy); 
            ctx.lineTo(hx + 22, hy - 12); 
            ctx.stroke();
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(hx + 11, hy - 1); 
            ctx.lineTo(hx + 21, hy - 11);
            ctx.stroke();
            ctx.shadowBlur = 0; 
            
            ctx.strokeStyle = '#f39c12'; 
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(hx + 7, hy - 3);
            ctx.lineTo(hx + 13, hy + 3);
            ctx.stroke();
            
            ctx.strokeStyle = '#8d6e63';
            ctx.beginPath();
            ctx.moveTo(hx + 10, hy);
            ctx.lineTo(hx + 6, hy + 4);
            ctx.stroke();
            
            ctx.fillStyle = '#f39c12';
            ctx.beginPath();
            ctx.arc(hx + 5, hy + 5, 2.5, 0, Math.PI*2);
            ctx.fill();

            dragons.forEach(dragon => {
                let dx = dragon.x * tileSize + tileSize / 2;
                let dy = dragon.y * tileSize + tileSize / 2;

                ctx.fillStyle = colors.dragon;
                ctx.beginPath();
                ctx.moveTo(dx, dy - 15);
                ctx.lineTo(dx + 15, dy + 10);
                ctx.lineTo(dx - 15, dy + 10);
                ctx.fill();

                ctx.fillStyle = '#900C3F';
                ctx.beginPath();
                ctx.moveTo(dx - 10, dy - 5);
                ctx.lineTo(dx - 15, dy - 18);
                ctx.lineTo(dx - 5, dy - 10);
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(dx + 10, dy - 5);
                ctx.lineTo(dx + 15, dy - 18);
                ctx.lineTo(dx + 5, dy - 10);
                ctx.fill();

                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.arc(dx - 5, dy + 2, 3, 0, Math.PI*2);
                ctx.arc(dx + 5, dy + 2, 3, 0, Math.PI*2);
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.fillRect(dx - 6, dy, 2, 4);
                ctx.fillRect(dx + 4, dy, 2, 4);

                if (dragon.fire.active) {
                    ctx.save();
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ff0000'; 
                    
                    let fLength = 28 + Math.random() * 22; 
                    
                    ctx.beginPath();
                    ctx.moveTo(dx, dy + 10); 
                    
                    ctx.lineTo(dx - 9 - Math.random() * 6, dy + 15 + Math.random() * 10);
                    ctx.lineTo(dx - 4 + Math.random() * 6, dy + 22 + Math.random() * 10);
                    
                    ctx.lineTo(dx, dy + 10 + fLength);
                    
                    ctx.lineTo(dx + 4 - Math.random() * 6, dy + 22 + Math.random() * 10);
                    ctx.lineTo(dx + 9 + Math.random() * 6, dy + 15 + Math.random() * 10);
                    
                    ctx.closePath();
                    
                    let fireGradient = ctx.createLinearGradient(dx, dy + 10, dx, dy + 10 + fLength);
                    fireGradient.addColorStop(0, 'rgba(255, 30, 0, 0.95)');    
                    fireGradient.addColorStop(0.5, 'rgba(220, 0, 0, 0.9)');  
                    fireGradient.addColorStop(1, 'rgba(120, 0, 0, 0)');        
                    
                    ctx.fillStyle = fireGradient;
                    ctx.fill();
                    ctx.restore();
                }
            });

            ghosts.forEach(ghost => {
                if (ghost.active) {
                    ctx.save();
                    ctx.globalAlpha = 0.8 + Math.sin(animationTime * 5) * 0.2;
                    ctx.fillStyle = '#512e5f';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#9b59b6';
                    
                    ctx.beginPath();
                    ctx.moveTo(ghost.px, ghost.py - 15);
                    ctx.lineTo(ghost.px - 15, ghost.py + 15);
                    ctx.quadraticCurveTo(ghost.px, ghost.py + 10, ghost.px + 15, ghost.py + 15);
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(ghost.px, ghost.py - 12, 8, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#f1c40f'; 
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#f1c40f';
                    ctx.beginPath();
                    ctx.arc(ghost.px - 3, ghost.py - 12, 2, 0, Math.PI * 2);
                    ctx.arc(ghost.px + 3, ghost.py - 12, 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }
            });

            fireballs.forEach(fb => {
                if(fb.active) {
                    ctx.save();
                    ctx.shadowBlur = 15 + Math.random() * 5;
                    ctx.shadowColor = '#e74c3c';
                    
                    ctx.fillStyle = '#c0392b';
                    ctx.beginPath();
                    ctx.arc(fb.x, fb.y, 8, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath();
                    ctx.arc(fb.x, fb.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.restore();
                }
            });
        }

        function gameLoop() {
            animationTime += 0.08; 

            if (isPlaying) {
                if (sliding) {
                    slideFrameCounter--;
                    if (slideFrameCounter <= 0) {
                        let nx = hobbit.x + slideDir.x;
                        let ny = hobbit.y + slideDir.y;

                        if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && mapLayout[ny][nx] !== '1' && mapLayout[ny][nx] !== 'T' && slideDistanceRemaining > 0) {
                            hobbit.x = nx;
                            hobbit.y = ny;
                            checkInteractions();
                            slideDistanceRemaining--; 
                            slideFrameCounter = slideSpeed; 
                            
                            if (slideDistanceRemaining <= 0) {
                                sliding = false;
                            }
                        } else {
                            sliding = false; 
                        }
                    }
                }

                dragons.forEach(dragon => {
                    dragon.fire.active = true;
                });

                let hx = hobbit.x * tileSize + tileSize/2;
                let hy = hobbit.y * tileSize + tileSize/2;

                ghosts.forEach(ghost => {
                    if (ghost.active) {
                        let dist = Math.hypot(hx - ghost.px, hy - ghost.py);
                        
                        if (dist > 0) {
                            ghost.px += ((hx - ghost.px) / dist) * 1.6; 
                            ghost.py += ((hy - ghost.py) / dist) * 1.6;
                        }
                        
                        if (dist < tileSize/2) {
                            endGame(false, "BURNED BY A GHOST!"); 
                        }
                    }
                });

                fireballs.forEach(fb => {
                    if(fb.active) {
                        fb.x += fb.vx;
                        fb.y += fb.vy;
                        
                        if (fb.x < -50 || fb.x > canvas.width + 50 || fb.y < -50 || fb.y > canvas.height + 50) {
                            fb.active = false;
                        }
                        
                        if (Math.hypot(fb.x - hx, fb.y - hy) < tileSize/2) {
                            endGame(false, "BURNED BY A FIREBALL!");
                        }
                    }
                });
                fireballs = fireballs.filter(fb => fb.active);
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        document.getElementById('dungeon-box').innerText = `Level ${currentLevel}`;
        updateGoldenEggsUI(9); 
        document.getElementById('egg-count').innerText = "0 / " + totalEggs;
        document.getElementById('start-btn').innerText = `Start Level ${currentLevel}`;

        requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
