<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eggs of the Dragon - Level 2 (The Foggy Maze)</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            background-color: #0b0c10; /* Daha karanlık arka plan */
            color: #ecf0f1;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
        }

        #game-container {
            border: 8px solid #1f2833;
            background-color: #1a1a2e;
            box-shadow: 0 0 50px rgba(0, 0, 0, 1), 0 0 15px rgba(44, 62, 80, 0.8);
            border-radius: 12px;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: -55px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px black;
        }

        .stat-box {
            padding: 8px 18px;
            background: linear-gradient(180deg, #34495e, #2c3e50);
            border: 2px solid #7f8c8d;
            border-radius: 6px;
            color: #f1c40f;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        #dungeon-box {
            color: #bdc3c7;
        }

        #mute-btn {
            padding: 8px 14px;
            background: linear-gradient(180deg, #34495e, #2c3e50);
            border: 2px solid #7f8c8d;
            border-radius: 6px;
            color: #ecf0f1;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        #mute-btn:hover {
            background: linear-gradient(180deg, #415b76, #34495e);
            transform: scale(1.05);

        }

        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .menu-text {
            font-size: 42px;
            color: #e74c3c;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px #000;
        }

        .sub-text {
            font-size: 18px;
            color: #bdc3c7;
            margin-bottom: 5px;
            text-align: center;
        }

        button.main-btn {
            margin-top: 30px;
            padding: 12px 25px;
            font-size: 20px;
            font-weight: bold;
            background-color: #27ae60;
            color: white;
            border: 2px solid #2ecc71;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;

        }

        button.main-btn:hover {
            background-color: #66fcf1;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <radialGradient id="goldGrad" cx="30%" cy="30%" r="65%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="20%" stop-color="#fff59d"/>
                <stop offset="50%" stop-color="#f1c40f"/>
                <stop offset="75%" stop-color="#d35400"/>
                <stop offset="100%" stop-color="#111111"/>
            </radialGradient>
        </defs>
        <symbol id="golden-egg-svg" viewBox="0 0 100 120">
            <ellipse cx="50" cy="60" rx="35" ry="50" fill="url(#goldGrad)" />
            <path d="M42,42 Q50,49 58,42" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="3" stroke-linecap="round"/>
            <path d="M28,62 Q36,69 44,62" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="3" stroke-linecap="round"/>
            <path d="M56,62 Q64,69 72,62" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="3" stroke-linecap="round"/>
            <path d="M42,82 Q50,89 58,82" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="3" stroke-linecap="round"/>
        </symbol>
    </svg>

    <div id="game-wrapper">
        <div id="ui">
            <div style="display: flex; align-items: center; gap: 0;">
        <div class="stat-box" style="border-top-right-radius: 0; border-bottom-right-radius: 0; border-right: none;">Eggs: <span id="egg-count">0/5</span></div>
        <div class="stat-box" id="dungeon-box" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">Level 2</div>
    </div>
    
    <!-- Orta Grup: Altın Yumurtalar -->
    <div id="golden-eggs" style="display: flex; gap: 5px; align-items: center;"></div>

    <!-- Sağ Grup: Ses Butonu -->
    <button id="mute-btn" onclick="toggleMute()" title="Ses Aç/Kapat">🔊</button>
</div>

        
        <div id="game-container">
            <canvas id="gameCanvas" width="600" height="600"></canvas>
        </div>

        <div id="overlay-screen">
            <div class="menu-text" id="title-text">LEVEL 2: THE FOGGY MAZE</div>
            <div class="sub-text" id="desc-text1">A thick magical fog covers the dungeon</div>
            <div class="sub-text" id="desc-text2">Collect 5 eggs. The dragon hunts in the shadows</div>
            <div class="sub-text" id="desc-text3">Movement: Arrow Keys or W, A, S, D</div>
            
            <div id="win-egg-icon" style="width: 100px; height: 120px; display: none; margin-top: 15px; filter: drop-shadow(0 0 25px gold);">
                <svg width="100%" height="100%"><use href="#golden-egg-svg"></use></svg>
            </div>
            
            <button class="main-btn" id="start-btn" onclick="startGame()">Start Level 2</button>
        </div>
    </div>

    <script>
        // --- GAME STATE ---
        let currentLevel = 2; // Level 2 spesifik kodu

        // --- SOUND ENGINE (Web Audio API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let isMuted = false;

        function toggleMute() {
            isMuted = !isMuted;
            const muteBtn = document.getElementById('mute-btn');
            if (isMuted) {
                muteBtn.innerText = "🔇";
                muteBtn.style.color = "#e74c3c";
            } else {
                muteBtn.innerText = "🔊";
                muteBtn.style.color = "#ecf0f1";
            }
        }
        
        function playTone(freq, type, duration, vol = 0.1) {
            if (isMuted) return;
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        let bgmInterval;
        let bgmStep = 0;

        const sfx = {
            start: () => {
                playTone(200, 'square', 0.2, 0.1); 
                setTimeout(() => playTone(150, 'square', 0.4, 0.1), 200); 
            },
            collect: () => {
                playTone(587.33, 'triangle', 0.1, 0.2); 
                setTimeout(() => playTone(880.00, 'square', 0.2, 0.15), 80); 
            },
            caught: () => {
                const dropNotes = [180, 150, 110, 80, 60, 40];
                dropNotes.forEach((freq, index) => {
                    setTimeout(() => {
                        playTone(freq, 'sawtooth', index === dropNotes.length - 1 ? 0.7 : 0.15, 0.25);
                    }, index * 90);
                });
            },
            win: () => {
                const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50]; 
                notes.forEach((freq, index) => {
                    setTimeout(() => {
                        playTone(freq, 'square', index === notes.length - 1 ? 0.5 : 0.12, 0.18);
                    }, index * 120);
                });
            },
            startBGM: () => {
                clearInterval(bgmInterval);
                bgmStep = 0;
                // Level 2 - Gerilimli, karanlık ve daha yavaş bir tema (Minor gam)
                const melody = [146.83, 164.81, 146.83, 130.81, 110, 130.81]; // D3, E3, D3, C3, A2, C3
                bgmInterval = setInterval(() => {
                    if (!isPlaying || isMuted) return;
                    playTone(melody[bgmStep], 'sawtooth', 0.3, 0.04);
                    bgmStep = (bgmStep + 1) % melody.length;
                }, 350); 
            },
            stopBGM: () => {
                clearInterval(bgmInterval);
            }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Level 2'ye özel tamamen yeni harita ve merkezden sapan 4 yeni portal (3,3), (11,3), (3,11), (11,11)
        const mapLayout = [
            "111111111111111",
            "100010000010001",
            "101010111010101",
            "101P0001000P101",
            "101111010111101",
            "100000000000001",
            "111011101110111",
            "100000000000001",
            "111011101110111",
            "100000000000001",
            "101111010111101",
            "101P0001000P101",
            "101010111010101",
            "100010000010001",
            "111111111111111"
        ];

        const rows = mapLayout.length;
        const cols = mapLayout[0].length;
        const tileSize = canvas.width / cols;

        let hobbit = { x: 7, y: 7 }; 
        let dragon = { x: 7, y: 1 }; 
        let eggs = [];
        
        // Level 2 için 5 Yumurta
        const totalEggs = 5; 
        let eggsCollected = 0;
        
        let isPlaying = false;
        let dragonInterval;
        let dragonSpeed = 380; // Biraz daha hızlandı
        let animationTime = 0; 

        let dragonFire = {
            active: false,
            timer: 0,
            nextFireIn: 100
        };

        const colors = {
            floor: '#0b0c10', // Karanlık zemin
            dragon: '#c0392b'
        };

        // 5. renk mor (Mor Ejderha Yumurtası eklendi)
        const eggColors = ['#f1c40f', '#3498db', '#e74c3c', '#2ecc71', '#9b59b6'];

        window.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
            
            let nx = hobbit.x;
            let ny = hobbit.y;

            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') ny--;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') ny++;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') nx--;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') nx++;

            if (mapLayout[ny][nx] !== '1') {
                hobbit.x = nx;
                hobbit.y = ny;
                checkInteractions();
            }
        });

        // Üst paneldeki altın yumurta listesini günceller (Kazanınca 2 tane olacak)
        function updateGoldenEggsUI() {
            const container = document.getElementById('golden-eggs');
            container.innerHTML = ''; 
            const completedLevels = currentLevel - 1;
            
            for (let i = 0; i < completedLevels; i++) {
                const eggDiv = document.createElement('div');
                eggDiv.style.width = '28px';
                eggDiv.style.height = '34px';
                eggDiv.style.filter = 'drop-shadow(0 0 8px gold)';
                eggDiv.innerHTML = '<svg width="100%" height="100%"><use href="#golden-egg-svg"></use></svg>';
                container.appendChild(eggDiv);
            }
        }

        function startGame() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            sfx.start();
            sfx.startBGM();

            document.getElementById('overlay-screen').style.display = 'none';
            document.getElementById('win-egg-icon').style.display = 'none';
            
            document.getElementById('dungeon-box').innerText = "Level " + currentLevel;
            updateGoldenEggsUI();

            hobbit = { x: 7, y: 7 };
            dragon = { x: 7, y: 1 };
            eggsCollected = 0;
            document.getElementById('egg-count').innerText = "0 / " +totalEggs;
            
            dragonFire.active = false;
            dragonFire.nextFireIn = 120;

            spawnEggs();
            
            isPlaying = true;
            clearInterval(dragonInterval);
            dragonInterval = setInterval(moveDragon, dragonSpeed);
        }

        function endGame(won) {
            isPlaying = false;
            dragonFire.active = false;
            clearInterval(dragonInterval);
            sfx.stopBGM();
            
            if (won) sfx.win();
            else sfx.caught();

            const overlay = document.getElementById('overlay-screen');
            const title = document.getElementById('title-text');
            const desc1 = document.getElementById('desc-text1');
            const desc2 = document.getElementById('desc-text2');
            const desc3 = document.getElementById('desc-text3');
            const winEggIcon = document.getElementById('win-egg-icon');
            const btn = document.getElementById('start-btn');

            overlay.style.display = 'flex';
            if (won) {

            window.parent.postMessage({ type: 'level_completed', levelNumber: 2 }, '*');

                title.innerText = 'LEVEL ' + currentLevel + ' COMPLETED!';
                title.style.color = '#f1c40f';
                desc1.innerText = 'You braved the fog and collected the eggs.';
                desc2.innerText = 'You won another Golden Dragon Egg!';
                desc3.innerText = 'Movement: Arrow Keys or W, A, S, D';
                winEggIcon.style.display = 'block'; 
                
                currentLevel++; // Level 3'e geçişi tetikler
                btn.innerText = 'Start Level ' + currentLevel;

// Butona basıldığında bir sonraki level dosyasına gitmesini sağlar
                btn.onclick = function() {
                    if (currentLevel <= 10) {
                        window.location.href = "LEVEL" + currentLevel + ".html";
                    } else {
                        window.location.href = "LEVEL1.html"; // 10 bittiyse başa dön
                    }
                };
                

                // Oyuncu kazandığında bu fonksiyon üst panelde 2 altın yumurtayı gösterecek
                updateGoldenEggsUI();
            } else {
                title.innerText = 'CAUGHT!';
                title.style.color = '#c0392b';
                desc1.innerText = 'The dragon emerged from the shadows...';
                desc2.innerText = `Eggs Collected : ${eggsCollected} / 5`;
                desc3.innerText = 'Movement: Arrow Keys or W, A, S, D';
                winEggIcon.style.display = 'none';
                
                btn.innerText = 'Try Level ' + currentLevel + ' Again';
            }
        }

        function spawnEggs() {
            eggs = [];
            let validSpots = [];
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (mapLayout[y][x] === '0' && !(x === 7 && y === 7) && !(x === 7 && y === 1)) {
                        validSpots.push({x, y});
                    }
                }
            }

            validSpots.sort(() => Math.random() - 0.5);
            for (let i = 0; i < totalEggs; i++) {
                eggs.push({
                    x: validSpots[i].x,
                    y: validSpots[i].y,
                    color: eggColors[i]
                });
            }
        }

        function checkInteractions() {
            for (let i = 0; i < eggs.length; i++) {
                if (hobbit.x === eggs[i].x && hobbit.y === eggs[i].y) {
                    sfx.collect(); 
                    eggs.splice(i, 1); 
                    eggsCollected++;
                    document.getElementById('egg-count').innerText = `${eggsCollected} / ${totalEggs}`;
                    
                    if (eggsCollected === totalEggs) {
                        endGame(true); 
                        return;
                    }
                    break;
                }
            }

            // Yeni Portal Lokasyonları: (3,3), (11,3), (3,11), (11,11)
            if (mapLayout[hobbit.y][hobbit.x] === 'P') {
                if (hobbit.x === 3 && hobbit.y === 3) { hobbit.x = 11; hobbit.y = 11; }
                else if (hobbit.x === 11 && hobbit.y === 11) { hobbit.x = 3; hobbit.y = 3; }
                else if (hobbit.x === 11 && hobbit.y === 3) { hobbit.x = 3; hobbit.y = 11; }
                else if (hobbit.x === 3 && hobbit.y === 11) { hobbit.x = 11; hobbit.y = 3; }
            }

            if (hobbit.x === dragon.x && hobbit.y === dragon.y) {
                endGame(false);
            }
        }

        function moveDragon() {
            if (!isPlaying) return;

            if (dragon.x === hobbit.x && dragon.y === hobbit.y) {
                endGame(false);
                return;
            }

            // LEVEL 2 MEKANİĞİ: Ejderha karakterin 5 birimden daha uzağındaysa onu göremez ve rastgele gezinir.
            let dist = Math.abs(dragon.x - hobbit.x) + Math.abs(dragon.y - hobbit.y);
            let dirs = [{x:0,y:-1}, {x:0,y:1}, {x:-1,y:0}, {x:1,y:0}]; 

            if (dist > 5) {
                // Rastgele Dolaşma
                let validDirs = dirs.filter(d => {
                    let nx = dragon.x + d.x;
                    let ny = dragon.y + d.y;
                    return nx >= 0 && ny >= 0 && nx < cols && ny < rows && mapLayout[ny][nx] !== '1';
                });
                
                if(validDirs.length > 0) {
                    let d = validDirs[Math.floor(Math.random() * validDirs.length)];
                    dragon.x += d.x;
                    dragon.y += d.y;
                }
            } else {
                // Görüş alanında (Avlanma Modu - BFS)
                let queue = [[{ x: dragon.x, y: dragon.y }]];
                let visited = new Set();
                visited.add(`${dragon.x},${dragon.y}`);
                let nextMove = null;

                while (queue.length > 0) {
                    let path = queue.shift();
                    let curr = path[path.length - 1];

                    if (curr.x === hobbit.x && curr.y === hobbit.y) {
                        nextMove = path[1]; 
                        break;
                    }

                    for (let d of dirs) {
                        let nx = curr.x + d.x;
                        let ny = curr.y + d.y;

                        if (nx >= 0 && ny >= 0 && nx < cols && ny < rows && mapLayout[ny][nx] !== '1' && !visited.has(`${nx},${ny}`)) {
                            visited.add(`${nx},${ny}`);
                            queue.push([...path, { x: nx, y: ny }]);
                        }
                    }
                }

                if (nextMove) {
                    dragon.x = nextMove.x;
                    dragon.y = nextMove.y;
                }
            }

            if (dragon.x === hobbit.x && dragon.y === hobbit.y) {
                endGame(false);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Zemin ve Duvarlar (Daha karanlık stil)
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let px = x * tileSize;
                    let py = y * tileSize;

                    if (mapLayout[y][x] === '1') {
                        ctx.fillStyle = '#1f2833'; 
                        ctx.fillRect(px, py, tileSize, tileSize);
                        
                        ctx.strokeStyle = '#0b0c10'; 
                        ctx.lineWidth = 2;
                        
                        ctx.beginPath();
                        ctx.moveTo(px, py + tileSize / 3);
                        ctx.lineTo(px + tileSize, py + tileSize / 3);
                        ctx.moveTo(px, py + (tileSize * 2) / 3);
                        ctx.lineTo(px + tileSize, py + (tileSize * 2) / 3);
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.moveTo(px + tileSize / 3, py);
                        ctx.lineTo(px + tileSize / 3, py + tileSize / 3);
                        
                        ctx.moveTo(px + (tileSize * 2) / 3, py + tileSize / 3);
                        ctx.lineTo(px + (tileSize * 2) / 3, py + (tileSize * 2) / 3);
                        
                        ctx.moveTo(px + tileSize / 2, py + (tileSize * 2) / 3);
                        ctx.lineTo(px + tileSize / 2, py + tileSize);
                        ctx.stroke();
                    } else if (mapLayout[y][x] === 'P') {
                        // Koyu yeşil mistik portallar
                        ctx.fillStyle = '#0b0c10'; 
                        ctx.fillRect(px, py, tileSize, tileSize);
                        
                        ctx.fillStyle = '#45a29e';
                        ctx.beginPath();
                        ctx.arc(px + tileSize / 2, py + tileSize / 2, tileSize / 2.2, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = '#66fcf1';
                        ctx.beginPath();
                        ctx.arc(px + tileSize / 2, py + tileSize / 2, tileSize / 3, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                        ctx.beginPath();
                        ctx.arc(px + tileSize / 2, py + tileSize / 2, tileSize / 8, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillStyle = colors.floor;
                        ctx.fillRect(px, py, tileSize, tileSize);
                        ctx.fillStyle = 'rgba(255,255,255,0.03)';
                        ctx.fillRect(px + 10, py + 10, 4, 4);
                        ctx.fillRect(px + 25, py + 25, 3, 3);
                    }
                }
            }

            // 2. Yumurtalar
            eggs.forEach((egg, index) => {
                let cx = egg.x * tileSize + tileSize / 2;
                let floatOffset = Math.sin(animationTime + index) * 6; 
                let cy = (egg.y * tileSize + tileSize / 2) + floatOffset;
                
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.beginPath();
                let shadowSize = 10 - (floatOffset / 2);
                ctx.ellipse(cx, egg.y * tileSize + tileSize - 8, shadowSize, shadowSize / 2, 0, 0, Math.PI * 2);
                ctx.fill();

                let gradient = ctx.createRadialGradient(cx - 5, cy - 5, 2, cx, cy, tileSize / 2);
                gradient.addColorStop(0, '#ffffff'); 
                gradient.addColorStop(0.3, egg.color); 
                gradient.addColorStop(1, '#000'); 
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.ellipse(cx, cy, tileSize/3, tileSize/2.2, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(cx, cy - 6, 4, 0, Math.PI); 
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx - 6, cy + 2, 4, 0, Math.PI); 
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx + 6, cy + 2, 4, 0, Math.PI); 
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx, cy + 10, 4, 0, Math.PI); 
                ctx.stroke();
            });

            // 3. Kahraman 
            let hx = hobbit.x * tileSize + tileSize / 2;
            let hy = hobbit.y * tileSize + tileSize / 2;

            ctx.fillStyle = '#1e8449'; 
            ctx.beginPath();
            ctx.moveTo(hx, hy - 12);
            ctx.lineTo(hx - 16, hy + 14); 
            ctx.lineTo(hx - 5, hy + 16);
            ctx.lineTo(hx + 5, hy + 15);
            ctx.lineTo(hx + 14, hy + 13);
            ctx.fill();

            ctx.fillStyle = '#bdc3c7'; 
            ctx.beginPath();
            ctx.moveTo(hx - 7, hy - 4);
            ctx.lineTo(hx + 7, hy - 4);
            ctx.lineTo(hx + 9, hy + 10);
            ctx.lineTo(hx - 9, hy + 10);
            ctx.fill();
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(hx - 5, hy); ctx.lineTo(hx + 5, hy);
            ctx.moveTo(hx - 6, hy + 4); ctx.lineTo(hx + 6, hy + 4);
            ctx.moveTo(hx - 7, hy + 8); ctx.lineTo(hx + 7, hy + 8);
            ctx.stroke();

            ctx.fillStyle = '#2ecc71';
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(hx - 4, hy - 4, 2.5, 4, Math.PI/4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#e6ba95';
            ctx.beginPath();
            ctx.ellipse(hx - 7, hy + 14, 5, 3, 0, 0, Math.PI * 2);
            ctx.ellipse(hx + 7, hy + 14, 5, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            let headGrad = ctx.createRadialGradient(hx - 2, hy - 13, 1, hx, hy - 11, 8);
            headGrad.addColorStop(0, '#f5deb3');
            headGrad.addColorStop(1, '#d2a679');
            ctx.fillStyle = headGrad;
            ctx.beginPath();
            ctx.arc(hx, hy - 11, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.arc(hx - 3, hy - 12, 1.5, 0, Math.PI*2);
            ctx.arc(hx + 3, hy - 12, 1.5, 0, Math.PI*2);
            ctx.fill();

            ctx.fillStyle = '#d35400'; 
            ctx.beginPath();
            ctx.arc(hx, hy - 14, 8, Math.PI, 0); 
            ctx.arc(hx - 7, hy - 10, 4, 0, Math.PI * 2); 
            ctx.arc(hx + 7, hy - 10, 4, 0, Math.PI * 2); 
            ctx.arc(hx - 4, hy - 17, 3, 0, Math.PI * 2); 
            ctx.fill();

            ctx.save();
            ctx.beginPath();
            ctx.arc(hx - 12, hy + 2, 7, 0, Math.PI * 2);
            ctx.clip(); 
            ctx.fillStyle = '#2980b9';
            ctx.fillRect(hx - 20, hy - 6, 16, 16);
            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 2.5;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(hx - 19, hy - 2); ctx.lineTo(hx - 16, hy + 2); ctx.lineTo(hx - 13, hy - 2); ctx.lineTo(hx - 10, hy + 2); ctx.lineTo(hx - 7, hy - 2);
            ctx.stroke();
            ctx.restore(); 

            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffff'; 
            ctx.strokeStyle = '#e0f7fa'; 
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(hx + 10, hy); 
            ctx.lineTo(hx + 22, hy - 12); 
            ctx.stroke();
            ctx.shadowBlur = 0; 

            // 4. Ejderha
            let dx = dragon.x * tileSize + tileSize / 2;
            let dy = dragon.y * tileSize + tileSize / 2;

            ctx.fillStyle = colors.dragon;
            ctx.beginPath();
            ctx.moveTo(dx, dy - 15);
            ctx.lineTo(dx + 15, dy + 10);
            ctx.lineTo(dx - 15, dy + 10);
            ctx.fill();

            ctx.fillStyle = '#8e44ad';
            ctx.beginPath();
            ctx.moveTo(dx - 10, dy - 5);
            ctx.lineTo(dx - 15, dy - 18);
            ctx.lineTo(dx - 5, dy - 10);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(dx + 10, dy - 5);
            ctx.lineTo(dx + 15, dy - 18);
            ctx.lineTo(dx + 5, dy - 10);
            ctx.fill();

            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(dx - 5, dy + 2, 3, 0, Math.PI*2);
            ctx.arc(dx + 5, dy + 2, 3, 0, Math.PI*2);
            ctx.fill();

            // 5. LEVEL 2 SİS EFEKTİ (Görüş Kısıtlaması)
            let fogGrad = ctx.createRadialGradient(hx, hy, tileSize * 1.8, hx, hy, tileSize * 4);
            fogGrad.addColorStop(0, 'rgba(11, 12, 16, 0)');     // Oyuncunun etrafı açık
            fogGrad.addColorStop(0.5, 'rgba(11, 12, 16, 0.85)'); // Giderek kararıyor
            fogGrad.addColorStop(1, 'rgba(11, 12, 16, 1)');     // Haritanın uzağı zifiri karanlık
            
            ctx.fillStyle = fogGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 6. Ejderha Ateşi (Sisi yararak görünmesi için sis çizildikten sonra çiziyoruz)
            if (dragonFire.active) {
                ctx.save();
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#e74c3c'; 
                
                let fLength = 35 + Math.random() * 25; 
                
                ctx.beginPath();
                ctx.moveTo(dx, dy + 10); 
                
                ctx.lineTo(dx - 10 - Math.random() * 8, dy + 15 + Math.random() * 10);
                ctx.lineTo(dx - 5 + Math.random() * 6, dy + 25 + Math.random() * 10);
                
                ctx.lineTo(dx, dy + 10 + fLength);
                
                ctx.lineTo(dx + 5 - Math.random() * 6, dy + 25 + Math.random() * 10);
                ctx.lineTo(dx + 10 + Math.random() * 8, dy + 15 + Math.random() * 10);
                
                ctx.closePath();
                
                let fireGradient = ctx.createLinearGradient(dx, dy + 10, dx, dy + 10 + fLength);
                fireGradient.addColorStop(0, 'rgba(255, 255, 0, 1)');    
                fireGradient.addColorStop(0.4, 'rgba(255, 120, 0, 0.9)');  
                fireGradient.addColorStop(1, 'rgba(255, 0, 0, 0)');        
                
                ctx.fillStyle = fireGradient;
                ctx.fill();
                ctx.restore();
            }
        }

        function gameLoop() {
            animationTime += 0.08; 

            if (isPlaying) {
                dragonFire.nextFireIn--;
                if (dragonFire.nextFireIn <= 0) {
                    dragonFire.active = true;
                    dragonFire.timer = 50 + Math.floor(Math.random() * 30); 
                    dragonFire.nextFireIn = Math.floor(Math.random() * 150) + 120; 
                }

                if (dragonFire.active) {
                    dragonFire.timer--;
                    if (dragonFire.timer <= 0) {
                        dragonFire.active = false;
                    }
                }
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        updateGoldenEggsUI(); // Başlangıçta 1 altın yumurta (Level 1'den kazanılan) görüntülenecek
        requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
